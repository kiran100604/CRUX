<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CRUX — Setup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f883d'/%3E%3Cpath d='M9 9 L23 23 M23 9 L9 23' stroke='white' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/tokens.css">
<script>try{if(localStorage.getItem('crux-theme')==='dark')document.documentElement.classList.add('crux-dark');}catch(e){}</script>
<style>
  /* setup-specific aliases on top of the shared tokens (tokens.css) */
  :root{ --card:var(--paper); --r:14px; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--canvas); color:var(--body); font-family:var(--sans); font-size:16px;
    -webkit-font-smoothing:antialiased; display:flex; align-items:flex-start; justify-content:center}
  .wrap{width:100%; max-width:680px; padding:48px 24px 80px}
  .brand{display:flex; align-items:center; margin-bottom:34px}
  .wordmark{font-weight:800; letter-spacing:-.01em; font-size:22px; color:var(--ink);
    display:inline-flex; align-items:center; font-family:var(--sans)}
  .wordmark .xmark{position:relative; display:inline-block; width:.74em; height:.86em; margin-left:.01em; color:var(--muted)}
  .wordmark .xmark svg{position:absolute; inset:0; width:100%; height:100%}
  .wordmark .xmark .core{fill:var(--green); stroke:none}
  .kicker{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted2); margin-bottom:14px}
  h1{font-size:38px; font-weight:600; letter-spacing:-.02em; color:var(--ink); margin:0 0 12px; line-height:1.1}
  .lede{font-size:17px; color:var(--muted); line-height:1.55; margin:0 0 36px; max-width:560px}
  .step{background:var(--card); border:1px solid var(--hair); border-radius:var(--r); padding:24px 26px; margin-bottom:18px}
  .step .n{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--teal); margin-bottom:8px}
  .step h2{font-size:19px; font-weight:600; color:var(--ink); margin:0 0 6px; letter-spacing:-.01em}
  .step p{font-size:14px; color:var(--muted); line-height:1.55; margin:0 0 16px}
  label.field{display:block; margin-bottom:12px}
  label.field span{display:block; font-size:13px; color:var(--muted); margin-bottom:6px}
  input[type=text],input[type=password]{width:100%; height:46px; border:1px solid var(--hair); background:var(--canvas);
    border-radius:10px; padding:0 15px; font-size:15px; color:var(--ink); outline:none; font-family:var(--mono)}
  input:focus{border-color:var(--ink)}
  .adv{margin-top:6px} .adv summary{font-size:13px; color:var(--muted); cursor:pointer; padding:6px 0}
  .adv[open] summary{margin-bottom:10px}
  .chords{display:flex; flex-wrap:wrap; gap:10px}
  .chord{border:1px solid var(--hair); background:var(--canvas); color:var(--body); border-radius:10px;
    padding:11px 15px; font-family:var(--mono); font-size:13px; cursor:pointer; transition:.12s}
  .chord:hover{border-color:var(--muted2)}
  .chord.on{border-color:var(--ink); background:var(--ink); color:#fff}
  .recorder{border:1.5px dashed var(--muted2); border-radius:10px; padding:14px 16px; font-family:var(--mono);
    font-size:14px; color:var(--ink); background:var(--canvas); cursor:text; outline:none; text-align:center}
  .recorder:focus{border-style:solid; border-color:var(--ink); background:var(--soft)}
  .vmsg{font-size:12.5px; color:var(--muted); margin-top:8px}
  .vmsg.ok{color:var(--green)} .vmsg.bad{color:var(--coral)}
  .toggle{display:flex; align-items:center; gap:12px; cursor:pointer}
  .switch{width:44px; height:26px; border-radius:var(--pill); background:var(--strong,#e3d9bf); position:relative; transition:.18s; flex:none; border:1px solid var(--hair)}
  .switch::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.18s; box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle.on .switch{background:var(--green); border-color:var(--green)}
  .toggle.on .switch::after{transform:translateX(18px)}
  .toggle .lbl{font-size:14px; color:var(--ink); font-weight:500}
  .toggle .lbl small{display:block; color:var(--muted); font-weight:400; font-size:12.5px; margin-top:2px}
  .hint{font-size:12.5px; color:var(--muted2); margin-top:12px; line-height:1.5}
  .go{margin-top:26px; display:flex; align-items:center; gap:16px}
  .btn{border:none; border-radius:12px; font-size:15px; font-weight:600; padding:0 26px; height:50px;
    background:var(--ink); color:#fff; cursor:pointer; display:inline-flex; align-items:center; gap:9px}
  .btn:hover{filter:brightness(1.2)} .btn:disabled{opacity:.5; cursor:default}
  .skip{font-size:14px; color:var(--muted); text-decoration:underline; text-underline-offset:3px; cursor:pointer}
  .done{text-align:center; padding:40px 0}
  .done .tick{width:64px;height:64px;border-radius:50%;background:var(--teal-bg);border:1px solid var(--teal-line);
    display:grid;place-items:center;margin:0 auto 22px}
  .done .tick svg{width:30px;height:30px;stroke:var(--green);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .done h1{margin-bottom:10px}
  .mono{font-family:var(--mono); font-size:.92em; background:var(--soft); padding:1px 6px; border-radius:5px}
  .privacy{font-family:var(--mono); font-size:11px; color:var(--muted2); letter-spacing:.06em; text-align:center; margin-top:40px}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="brand">
    <span class="wordmark">cru<span class="xmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M5 5 L19 19 M19 5 L5 19"/><circle class="core" cx="12" cy="12" r="3.4"/></svg></span></span>
  </div>
  <div id="body"></div>
  <div class="privacy">LOCAL-FIRST · YOUR DATA NEVER LEAVES THIS MACHINE</div>
</div>

<script>
const $=s=>document.querySelector(s);
const post=(u,b)=>fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json());
let S={}, sel=0, hook=true, presets=[], customMode=false, custom=null;

const _cap = m => m==="cmd"?"Super":m==="ctrl"?"Ctrl":m[0].toUpperCase()+m.slice(1);
const chordLabel=(mods,key)=>[...mods.map(_cap), (key==='space'?'Space':key.toUpperCase())].join(" + ");

const RESERVED={
  "ctrl+shift+i":"browser DevTools","ctrl+shift+j":"browser DevTools",
  "ctrl+shift+c":"browser DevTools","ctrl+shift+k":"browser console",
  "ctrl+w":"close tab","ctrl+t":"new tab","ctrl+n":"new window","ctrl+q":"quit app",
  "ctrl+c":"copy","ctrl+v":"paste","ctrl+x":"cut","ctrl+z":"undo","ctrl+a":"select all","ctrl+s":"save",
  "alt+tab":"switch windows","alt+f4":"close window",
};
function validateChord(mods,key){
  if(!key) return {ok:false,msg:"Press a key."};
  if(!/^([a-z0-9]|space|f([1-9]|1[0-2]))$/.test(key))
    return {ok:false,msg:"Use a letter, number, Space, or F-key — punctuation/sequences aren't portable."};
  if(!mods.some(m=>["ctrl","alt","cmd"].includes(m)))
    return {ok:false,msg:"Add Ctrl, Alt, or Super — a bare key would fire all the time."};
  if(S.platform!=="darwin" && mods.includes("cmd"))
    return {ok:false,msg:"Super/Win shortcuts get grabbed by your desktop — use Ctrl or Alt instead."};
  const order=["ctrl","alt","shift","cmd"];
  const id=order.filter(m=>mods.includes(m)).join("+")+"+"+key;
  if(RESERVED[id]) return {ok:false,msg:`Reserved for ${RESERVED[id]} — pick another.`};
  return {ok:true,msg:"Looks good."};
}
function _normKey(e){
  if(e.key===" "||e.code==="Space") return "space";
  if(/^[a-zA-Z]$/.test(e.key)) return e.key.toLowerCase();
  if(/^[0-9]$/.test(e.key)) return e.key;
  if(/^F([1-9]|1[0-2])$/.test(e.key)) return e.key.toLowerCase();
  return e.key.length===1 ? e.key.toLowerCase() : e.key.toLowerCase(); // flagged by validate
}
function onRecord(e){
  e.preventDefault();
  if(["Control","Alt","Shift","Meta","OS"].includes(e.key)) return; // wait for the real key
  const mods=[];
  if(e.ctrlKey) mods.push("ctrl");
  if(e.altKey) mods.push("alt");
  if(e.shiftKey) mods.push("shift");
  if(e.metaKey) mods.push("cmd");
  const key=_normKey(e);
  custom={mods,key,label:chordLabel(mods,key)};
  updateHint();
}

function buildPresets(plat){
  const mk = (mods,key)=>({mods,key,label:chordLabel(mods,key)});
  if(plat==="darwin")
    return [ mk(["cmd","shift"],"space"), mk(["cmd","ctrl"],"c"), mk(["cmd","ctrl"],"space"), mk(["cmd","shift"],"u") ];
  // Windows/Linux: avoid Ctrl+Shift+{I,J,C,K} (browser DevTools). Space is safe.
  return [ mk(["ctrl","shift"],"space"), mk(["ctrl","alt"],"c"), mk(["ctrl","alt"],"k"), mk(["ctrl","alt"],"space") ];
}

function form(){
  const plat = S.platform==="darwin"?"macOS":S.platform==="win32"?"Windows":"Linux";
  $("#body").innerHTML = `
    <div class="kicker">First-time setup · about 30 seconds</div>
    <h1>Welcome to CRUX.</h1>
    <p class="lede">A local memory for your AI coding agents. Capture decisions once; CRUX
      injects the right ones into Claude Code automatically. Let's wire it up — everything
      here is optional and stays on this ${plat} machine.</p>

    <div class="step">
      <div class="n">Step 1 · Connect a model — makes CRUX live</div>
      <h2>One key powers everything</h2>
      <p>Paste a single <b>NVIDIA API key</b> to run the LLM <i>and</i> embeddings — enrichment, subjects, search and synthesis all go live. Free key at <span class="mono">build.nvidia.com</span>. Skip to run fully offline (rougher); you can add it later.</p>
      <label class="field"><span>NVIDIA API key — LLM + embeddings</span>
        <input id="nv" type="password" placeholder="${S.has_nvidia?'• already set — leave blank to keep':'nvapi-…'}" autocomplete="off"></label>
      <details class="adv"><summary>Use a different provider instead</summary>
        <label class="field"><span>Anthropic API key (LLM)</span>
          <input id="ak" type="password" placeholder="${S.has_anthropic?'• already set — leave blank to keep':'sk-ant-…'}" autocomplete="off"></label>
        <label class="field"><span>OpenAI API key (embeddings)</span>
          <input id="ok" type="password" placeholder="${S.has_openai?'• already set — leave blank to keep':'sk-…'}" autocomplete="off"></label>
      </details>
    </div>

    <div class="step">
      <div class="n">Step 2 · Capture hotkey</div>
      <h2>Select text anywhere → press the chord → it's saved</h2>
      <p>Pick the keyboard shortcut you want. The hotkey is active whenever the
        <b>CRUX tray app</b> is running (<span class="mono">crux app</span>).</p>
      <div class="chords" id="chords"></div>
      <div class="hint" id="chordhint"></div>
    </div>

    <div class="step">
      <div class="n">Step 3 · Claude Code</div>
      <h2>Auto-inject context on every prompt</h2>
      <p>Adds a global hook so Claude Code pulls your verified knowledge automatically — no tool calls needed.</p>
      <div class="toggle ${hook?'on':''}" id="hooktoggle">
        <div class="switch"></div>
        <div class="lbl">Install the Claude Code hook${S.hook_installed?' <small>already installed — keeping it</small>':''}
          ${S.hook_installed?'':'<small>Recommended. Writes to ~/.claude/settings.json</small>'}</div>
      </div>
    </div>

    <div class="go">
      <button class="btn" id="finish">Finish setup →</button>
      <span class="skip" id="skip">Skip — use defaults</span>
    </div>`;
  drawChords();
  $("#hooktoggle").onclick=()=>{hook=!hook; $("#hooktoggle").classList.toggle("on",hook);};
  $("#finish").onclick=()=>apply(false);
  $("#skip").onclick=()=>apply(true);
}

function drawChords(){
  $("#chords").innerHTML = presets.map((c,i)=>
    `<button class="chord ${(!customMode&&i===sel)?'on':''}" data-i="${i}">${c.label}</button>`).join("")
    + `<button class="chord ${customMode?'on':''}" id="customchip">✎ Custom…</button>`;
  $("#chords").querySelectorAll(".chord[data-i]").forEach(b=>b.onclick=()=>{
    customMode=false; sel=+b.dataset.i; drawChords(); updateHint();});
  $("#customchip").onclick=()=>{customMode=true; drawChords(); updateHint();
    setTimeout(()=>{const r=$("#recorder"); if(r) r.focus();},0);};
  updateHint();
}
function updateHint(){
  if(customMode){
    const v = custom ? validateChord(custom.mods,custom.key) : null;
    $("#chordhint").innerHTML =
      `<div tabindex="0" id="recorder" class="recorder">${custom?custom.label:"Click here, then press your shortcut…"}</div>`
      + `<div class="vmsg ${v?(v.ok?'ok':'bad'):''}">`
      + (v ? (v.ok?"✓ ":"⚠ ")+v.msg : "Press a modifier + a letter/number/Space/F-key (e.g. Ctrl+Shift+Z).")
      + `</div>`;
    const r=$("#recorder"); if(r) r.onkeydown=onRecord;
    return;
  }
  const c=presets[sel];
  const tips={darwin:"The tray app registers this chord (needs Accessibility permission).",
    win32:"The tray app registers this chord directly.",
    linux:"On Wayland, run `crux bind` to register it at the OS level."};
  $("#chordhint").textContent = `Chosen: ${c.label}. ` + (tips[S.platform]||"");
}

async function apply(useDefaults){
  let mods, key;
  if(!useDefaults){
    if(customMode){
      const v = custom && validateChord(custom.mods,custom.key);
      if(!v || !v.ok){ updateHint(); return; }   // block invalid custom chord
      mods=custom.mods; key=custom.key;
    } else { mods=presets[sel].mods; key=presets[sel].key; }
  }
  $("#finish").disabled=true; $("#finish").textContent="Saving…";
  const $v = id => { const el=$("#"+id); return (el && el.value) || null; };
  const payload = useDefaults ? {install_hook:true} : {
    nvidia_key: $v("nv"),
    anthropic_key: $v("ak"),
    openai_key: $v("ok"),
    install_hook: hook,
    chord_mods: mods, chord_key: key,
  };
  const r = await post("/api/setup", payload);
  done(r);
}

function done(r){
  $("#body").innerHTML = `
    <div class="done">
      <div class="tick"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h1>You're ready.</h1>
      <p class="lede" style="margin:0 auto 26px">
        Hotkey set to <b>${r.chord}</b>. Hook ${r.hook==="installed"?"installed":r.hook==="already-installed"?"already on":"skipped"}.
        ${(r.providers&&r.providers!=="offline")?`<b>Live</b> on ${r.providers} — enrichment, search & synthesis are on.`:"Running on offline models — add a key anytime to go live."}<br>
        Run <span class="mono">crux start</span> (one command, every OS) — then capture is: copy text (Ctrl+C) → press <b>${r.chord}</b>.
      </p>
      <button class="btn" id="open">Open dashboard →</button>
    </div>`;
  $("#open").onclick=()=>location.href="/";
}

(async()=>{
  S = await fetch("/api/setup").then(r=>r.json());
  presets = buildPresets(S.platform);
  form();
})();
</script>
</body>
</html>
