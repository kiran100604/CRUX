<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CRUX</title>
<style>
  :root{
    --canvas:#fdf8ec; --soft:#f4ecd8; --card:#efe6d0; --strong:#e3d9bf; --hair:#d6ccb2;
    --ink:#080808; --body:#2a251e; --muted:#574f41; --muted2:#83785f; --on:#fff;
    --teal:#143030; --teal-bg:#e3ede9; --teal-line:#bcd2cb;
    --peach:#a8541d; --peach-bg:#fbead8; --peach-line:#eccba9;
    --coral:#bf3422; --coral-bg:#fbe2dc; --coral-line:#eebcb1;
    --green:#15833f;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --pill:9999px;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--canvas); color:var(--body); font-family:var(--sans); font-size:16px;
    -webkit-font-smoothing:antialiased}
  .display{font-weight:600; letter-spacing:-.02em; color:var(--ink); line-height:1.05}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)} .muted2{color:var(--muted2)}
  button{font-family:var(--sans); cursor:pointer}
  a{color:inherit}

  /* nav */
  nav{position:sticky; top:0; z-index:30; height:64px; display:flex; align-items:center; gap:8px;
    padding:0 28px; background:var(--canvas); border-bottom:1px solid var(--hair)}
  .brand{display:flex; align-items:center; gap:10px; margin-right:22px}
  .brand .logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
    background:var(--ink)}
  .brand .logo svg{width:18px;height:18px}
  .brand .name{font-weight:700; letter-spacing:.16em; font-size:14px; color:var(--ink)}
  .brand .sub{font-size:9px; letter-spacing:.22em; color:var(--muted2); margin-top:1px}
  .tabs{display:flex; gap:4px}
  .tab{border:none; background:none; color:var(--muted); font-size:14px; font-weight:500;
    padding:8px 14px; border-radius:var(--pill); display:flex; align-items:center; gap:7px}
  .tab svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round; flex:none}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--ink); color:var(--on)}
  .tab .badge{font-family:var(--mono); font-size:11px; background:rgba(0,0,0,.08); color:var(--muted);
    padding:1px 7px; border-radius:var(--pill)}
  .tab.on .badge{background:rgba(255,255,255,.2); color:#fff}
  .tab.alert .badge{background:var(--coral); color:#fff}
  .navright{margin-left:auto; display:flex; align-items:center; gap:14px}
  .status{font-family:var(--mono); font-size:11px; color:var(--muted); border:1px solid var(--hair);
    border-radius:var(--pill); padding:5px 11px}
  .status b{color:var(--green)}
  .who{display:flex; align-items:center; gap:8px; border:1px solid var(--hair); border-radius:var(--pill);
    padding:4px 12px 4px 4px; font-size:13px; color:var(--ink)}
  .who .av{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;
    font-weight:600;display:grid;place-items:center}

  /* layout */
  .wrap{max-width:1180px; margin:0 auto; padding:34px 28px 80px}
  .crumb{font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--muted2);
    text-transform:uppercase; margin-bottom:22px}
  .crumb b{color:var(--muted)}

  /* hero */
  .hero{background:var(--soft); border:1px solid var(--hair); border-radius:var(--r-xl); padding:46px}
  .kicker{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted2); margin-bottom:18px}
  .hero h1{font-size:54px; margin:0 0 14px}
  .hero p{font-size:17px; color:var(--muted); max-width:620px; margin:0 0 26px; line-height:1.5}
  .row{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
  .btn{border:none; border-radius:var(--r-md); font-size:14px; font-weight:600; padding:0 20px; height:46px;
    display:inline-flex; align-items:center; gap:9px}
  .btn.primary{background:var(--ink); color:var(--on)}
  .btn.primary:hover{filter:brightness(1.15)}
  .btn.ghost{background:transparent; color:var(--ink); text-decoration:underline; text-underline-offset:3px;
    padding:0 4px; font-weight:500}
  .btn.teal{background:var(--teal); color:#fff}
  .btn.sm{height:38px; font-size:13px; padding:0 15px}
  .btn.out{background:var(--canvas); border:1px solid var(--hair); color:var(--ink)}
  .btn.danger{background:transparent; color:var(--coral); border:1px solid var(--coral-line)}

  /* capture */
  .capture{display:flex; gap:10px; margin-top:24px}
  .capture input{flex:1; height:50px; border:1px solid var(--hair); background:var(--canvas);
    border-radius:var(--r-md); padding:0 18px; font-size:15px; color:var(--ink); outline:none}
  .capture input:focus{border-color:var(--ink)}

  /* grid + cards */
  .cols{display:grid; grid-template-columns:1fr 1fr 360px; gap:18px; margin-top:18px}
  @media(max-width:980px){.cols{grid-template-columns:1fr}}
  .card{background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-lg); padding:24px}
  .card.accent-peach{background:var(--peach-bg); border-color:var(--peach-line)}
  .card.accent-coral{background:var(--coral-bg); border-color:var(--coral-line)}
  .card.accent-teal{background:var(--teal-bg); border-color:var(--teal-line)}
  .tagline{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:14px}
  .tagline.coral{color:var(--coral)} .tagline.peach{color:var(--peach)} .tagline.teal{color:var(--teal)}
  .card h3{font-size:19px; color:var(--ink); margin:0 0 10px; line-height:1.3; font-weight:600; letter-spacing:-.01em}
  .card .desc{font-size:14px; color:var(--muted); line-height:1.55; margin-bottom:18px}
  .card .foot{display:flex; gap:10px; align-items:center}

  /* activity */
  .act h4{font-family:var(--sans); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin:0 0 16px; display:flex; justify-content:space-between; align-items:center}
  .live{font-family:var(--mono); font-size:10px; color:var(--green); display:flex; gap:6px; align-items:center}
  .live::before{content:""; width:7px;height:7px;border-radius:50%;background:var(--green)}
  .ev{padding:13px 0; border-top:1px solid var(--hair)}
  .ev:first-of-type{border-top:none; padding-top:0}
  .ev .tag{font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:6px; margin-right:8px}
  .ev .when{font-family:var(--mono); font-size:11px; color:var(--muted2)}
  .ev .txt{font-size:13.5px; color:var(--body); margin-top:7px; line-height:1.5}
  .ev .txt b{color:var(--ink); font-weight:600}

  /* stat strip */
  .strip{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--hair);
    border:1px solid var(--hair); border-radius:var(--r-lg); overflow:hidden; margin-top:18px}
  .stat{background:var(--canvas); padding:18px 22px}
  .stat .l{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted2)}
  .stat .v{font-size:22px; color:var(--ink); margin-top:6px; font-weight:600; letter-spacing:-.01em}
  .stat .v small{font-size:13px; color:var(--green); font-weight:500; margin-left:6px}

  /* lists (KB / decisions) */
  .sectlabel{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted2); margin:30px 0 12px}
  .item{display:flex; gap:14px; padding:16px 18px; background:var(--canvas); border:1px solid var(--hair);
    border-radius:var(--r-lg); margin-bottom:10px; align-items:flex-start; cursor:pointer}
  .item:hover{border-color:var(--muted2)}
  .item .bar{width:4px; align-self:stretch; border-radius:3px; flex:none}
  .bar.teal{background:var(--teal)} .bar.peach{background:var(--peach)}
  .item .main{flex:1; min-width:0}
  .item .ti{font-size:15.5px; color:var(--ink); font-weight:600; letter-spacing:-.01em}
  .item .su{font-size:13.5px; color:var(--muted); margin-top:4px; line-height:1.5}
  .item .met{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap}
  .pill{font-family:var(--mono); font-size:10.5px; padding:3px 9px; border-radius:var(--pill);
    background:var(--card); color:var(--muted)}
  .pill.type{background:var(--teal-bg); color:var(--teal)}
  .pill.use{background:var(--peach-bg); color:var(--peach)}
  .pill.src{background:none; color:var(--muted2)}

  .seg{display:inline-flex; gap:2px; background:var(--card); border-radius:var(--pill); padding:4px; margin-bottom:6px}
  .seg button{border:none; background:none; color:var(--muted); font-family:var(--mono); font-size:12px;
    padding:6px 13px; border-radius:var(--pill)}
  .seg button.on{background:var(--canvas); color:var(--ink)}
  .seg button .d{display:inline-block; width:7px;height:7px;border-radius:50%; margin-right:6px; vertical-align:middle}

  .head{font-size:30px; margin:0 0 6px}
  .sub{font-size:15px; color:var(--muted); margin:0 0 26px; max-width:680px; line-height:1.5}

  /* conflict / decision card */
  .dcard{background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-xl); padding:30px; margin-bottom:18px}
  .dcard .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:12px}
  .chip{font-family:var(--mono); font-size:11px; padding:5px 11px; border-radius:var(--r-sm)}
  .chip.coral{background:var(--coral-bg); color:var(--coral)} .chip.peach{background:var(--peach-bg); color:var(--peach)}
  .dcard h3{font-size:22px; color:var(--ink); margin:0 0 18px; letter-spacing:-.01em}
  .compare{display:grid; grid-template-columns:1fr 40px 1fr; align-items:center; gap:0}
  @media(max-width:760px){.compare{grid-template-columns:1fr; gap:10px}}
  .pane{border-radius:var(--r-md); padding:18px}
  .pane.a{background:var(--coral-bg)} .pane.b{background:var(--teal-bg)}
  .pane .pl{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px}
  .pane.a .pl{color:var(--coral)} .pane.b .pl{color:var(--teal)}
  .pane .pt{font-size:14px; color:var(--ink); line-height:1.5}
  .arrow{text-align:center; color:var(--muted2)}
  .dfoot{display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px; flex-wrap:wrap}
  .dactions{display:flex; gap:9px}
  .refine{display:flex; flex-direction:column; gap:9px; margin-top:14px}
  .refine input{height:42px; border:1px solid var(--hair); background:var(--soft); border-radius:var(--r-md);
    padding:0 14px; font-size:14px; color:var(--ink); outline:none}
  .refine input:focus{border-color:var(--ink)}

  /* drawer */
  #scrim{position:fixed; inset:0; background:rgba(20,15,5,.28); z-index:40; opacity:0; pointer-events:none; transition:.25s}
  #scrim.on{opacity:1; pointer-events:auto}
  #drawer{position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; z-index:41; background:var(--canvas);
    border-left:1px solid var(--hair); transform:translateX(100%); transition:transform .3s cubic-bezier(.4,.2,.2,1);
    overflow:auto; padding:30px}
  #drawer.on{transform:none}
  #drawer .tier{display:inline-block; font-family:var(--mono); font-size:11px; padding:5px 11px; border-radius:var(--pill); margin-bottom:16px}
  .tier.teal{background:var(--teal-bg); color:var(--teal)} .tier.peach{background:var(--peach-bg); color:var(--peach)}
  #drawer h2{font-size:24px; color:var(--ink); margin:0 0 10px; letter-spacing:-.02em; line-height:1.2}
  #drawer .ds{font-size:15px; color:var(--muted); line-height:1.6; margin-bottom:18px}
  .usedb{display:inline-flex; gap:7px; align-items:center; font-family:var(--mono); font-size:12px; color:var(--green);
    background:rgba(31,157,87,.08); border:1px solid rgba(31,157,87,.2); padding:7px 12px; border-radius:var(--r-sm); margin-bottom:18px}
  .meta{font-family:var(--mono); font-size:12px; color:var(--muted); line-height:2; margin-bottom:18px}
  .meta b{color:var(--muted2); font-weight:400}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
  .edges{margin-bottom:18px; display:flex; flex-direction:column; gap:8px}
  .edges .edge{font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .edges .el{font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted2)}
  .edges .ep{background:var(--teal-bg); color:var(--teal); border:1px solid var(--teal-line); border-radius:var(--pill);
    padding:3px 10px; cursor:pointer; font-size:12.5px}
  .edges .ep:hover{filter:brightness(.97)}
  .acts{display:flex; flex-direction:column; gap:9px}
  .acts .btn{justify-content:center; width:100%}

  /* lenses (emergent topics) */
  .lensbar{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 14px}
  .lens{border:1px solid var(--hair); background:var(--canvas); color:var(--body); border-radius:var(--pill);
    padding:6px 14px; font-size:13px; cursor:pointer}
  .lens:hover{border-color:var(--muted2)}
  .lens.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .lens.new{border-style:dashed; color:var(--muted)}
  .lens .lx{margin-left:6px; opacity:.55} .lens .lx:hover{opacity:1; color:var(--coral)}

  /* knowledge explorer (two-pane) */
  .kbwrap{display:grid; grid-template-columns:320px 1fr; gap:18px; align-items:start; margin-top:8px}
  @media(max-width:900px){.kbwrap{grid-template-columns:1fr}}
  .kbnav{position:sticky; top:80px; background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-lg);
    padding:14px; max-height:calc(100vh - 110px); overflow:auto}
  .kbsearch{width:100%; height:38px; border:1px solid var(--hair); background:var(--soft); border-radius:var(--r-md);
    padding:0 12px; font-size:13px; color:var(--ink); outline:none; margin-bottom:10px}
  .kbsearch:focus{border-color:var(--ink)}
  .kbmodes{display:inline-flex; gap:2px; background:var(--card); border-radius:var(--pill); padding:3px; margin-bottom:12px}
  .kbmode{border:none; background:none; color:var(--muted); font-family:var(--mono); font-size:11px; padding:5px 12px; border-radius:var(--pill)}
  .kbmode.on{background:var(--canvas); color:var(--ink)}
  .kbgroup{margin-bottom:14px}
  .kbglabel{font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted2); margin:6px 2px 8px}
  .kbglabel span{color:var(--muted)}
  .navitem{padding:9px 11px; border-radius:var(--r-sm); cursor:pointer; border:1px solid transparent}
  .navitem:hover{background:var(--soft)}
  .navitem.sel{background:var(--ink)}
  .navitem.sel .nt{color:#fff}
  .navitem .nt{font-size:13.5px; color:var(--ink); font-weight:500; line-height:1.35;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .navitem .ni{display:flex; align-items:center; gap:6px; margin-top:5px}
  .navitem.sel .ipill{background:rgba(255,255,255,.18); color:#fff}
  .nbadge{font-family:var(--mono); font-size:10px; color:var(--muted2)}
  .navitem.sel .nbadge{color:rgba(255,255,255,.7)}
  .kbdetail{background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-lg); padding:28px 30px}
  .dhead{display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap}
  .dtitle{font-size:25px; color:var(--ink); margin:0 0 10px; letter-spacing:-.02em; line-height:1.2}
  .dstmt{font-size:16px; color:var(--body); line-height:1.6; background:var(--soft); border:1px solid var(--hair);
    border-radius:var(--r-md); padding:15px 17px}
  .dsection{margin-top:22px}
  .dsection .pl{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted2); margin-bottom:10px}
  .kbdetail .raw{font-size:14px; color:var(--body); line-height:1.6; background:var(--soft); border:1px solid var(--hair);
    border-radius:var(--r-sm); padding:13px 15px; white-space:pre-wrap; word-break:break-word}
  .kbdetail .edges{margin-bottom:0}

  /* search results */
  #res{position:absolute; z-index:35; background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-md);
    box-shadow:0 20px 50px rgba(40,30,10,.14); margin-top:6px; width:100%; display:none; overflow:hidden}
  #res.on{display:block}
  .rrow{display:flex; gap:10px; align-items:baseline; padding:11px 16px; cursor:pointer}
  .rrow:hover{background:var(--soft)}
  .rrow .dot{width:8px;height:8px;border-radius:50%; flex:none; transform:translateY(2px)}
  .rrow b{font-size:14px; color:var(--ink); font-weight:600} .rrow span{display:block; font-size:12px; color:var(--muted); margin-top:2px}
  .rrow .sc{font-family:var(--mono); font-size:11px; color:var(--muted2)}

  .empty{text-align:center; color:var(--muted2); padding:70px 0}
  .empty .big{font-size:20px; color:var(--muted); margin-bottom:8px; font-weight:500}

  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(16px); z-index:60;
    background:var(--ink); color:#fff; border-radius:var(--r-md); padding:12px 20px; font-size:14px; opacity:0;
    transition:.3s; pointer-events:none}
  .toast.on{opacity:1; transform:translateX(-50%)}
  footer{background:var(--soft); border-top:1px solid var(--hair); padding:34px 28px; text-align:center;
    font-family:var(--mono); font-size:11px; color:var(--muted2); letter-spacing:.08em}
  /* review inbox */
  .inboxbar{display:flex; align-items:center; justify-content:space-between; gap:14px; margin:6px 0 16px}
  .inboxbar .counts{display:flex; align-items:center; gap:16px; font-size:13px; color:var(--muted)}
  .inboxbar .counts span{display:inline-flex; align-items:center}
  .cdot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:7px; flex:none}
  .c-clean{background:var(--green)} .c-attention{background:var(--peach)} .c-conflict{background:var(--coral)}
  .irow{border:1px solid var(--hair); border-radius:var(--r-md); background:var(--canvas); margin-bottom:10px; overflow:hidden}
  .irow.s-conflict{border-color:var(--coral-line)} .irow.s-attention{border-color:var(--peach-line)}
  .irow.open{box-shadow:0 8px 30px rgba(40,30,10,.08)}
  .ihead{display:flex; align-items:center; gap:14px; padding:15px 18px; cursor:pointer}
  .ihead:hover{background:var(--soft)}
  .ihead .cdot{margin:0}
  .imain{flex:1; min-width:0}
  .ititle{font-size:15px; color:var(--ink); font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .imeta{font-size:12.5px; color:var(--muted); margin-top:4px; display:flex; align-items:center; gap:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ipill{font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase; background:var(--card); color:var(--muted); padding:2px 7px; border-radius:var(--pill); flex:none}
  .iwhen{font-size:11px; color:var(--muted2); flex:none}
  .chev{color:var(--muted2); font-size:12px; flex:none; width:14px; text-align:center}
  .ideep{padding:4px 18px 18px; border-top:1px solid var(--hair)}
  .ideep .kv{margin:14px 0 6px}
  .ideep .pl{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted2); margin-bottom:6px}
  .ideep .raw{font-size:14px; color:var(--body); line-height:1.55; background:var(--soft); border:1px solid var(--hair); border-radius:var(--r-sm); padding:12px 14px; white-space:pre-wrap; word-break:break-word}
  .fitbox{background:var(--peach-bg); border:1px solid var(--peach-line); border-radius:var(--r-md); padding:12px 14px; margin:12px 0}
  .fitbox .pl{color:var(--peach)} .fitbox .pt{font-size:14px; color:var(--ink); line-height:1.5}
  .fitbox .exist{font-size:14px; color:var(--ink); line-height:1.5}
  .fitbox .exist .es{font-size:13px; color:var(--muted); margin-top:4px; line-height:1.5}
  .fitbox.fb-coral{background:var(--coral-bg); border-color:var(--coral-line)}
  .fitbox.fb-coral .pl{color:var(--coral)}
  .ideep .reason{font-size:13.5px; color:var(--muted); line-height:1.6; margin:8px 0}
  .ideep .reason b{color:var(--ink); font-weight:600}
  .ipill.tier-core{background:var(--teal-bg); color:var(--teal)}
  .ipill.tier-mid{background:var(--peach-bg); color:var(--peach)}
  .ipill.tier-leaf{background:var(--card); color:var(--muted)}
  .tiersel{width:100%; height:42px; border:1px solid var(--hair); background:var(--canvas); color:var(--ink);
    border-radius:var(--r-md); padding:0 12px; font-family:var(--sans); font-size:14px; outline:none}
  .tiersel:focus{border-color:var(--ink)}
  .ideep .extracted{font-size:15.5px; color:var(--ink); line-height:1.55; background:var(--soft);
    border:1px solid var(--hair); border-radius:var(--r-sm); padding:13px 15px; font-weight:500}
  .discs{display:flex; flex-direction:column; gap:8px; margin:14px 0 4px}
  .disc{border:1px solid var(--hair); border-radius:var(--r-sm); background:var(--canvas)}
  .disc>summary{list-style:none; cursor:pointer; padding:9px 13px; font-size:12.5px; color:var(--muted);
    font-family:var(--mono); letter-spacing:.02em; user-select:none}
  .disc>summary::-webkit-details-marker{display:none}
  .disc>summary:hover{color:var(--ink)}
  .disc>summary b{color:var(--ink); font-weight:600}
  .disc[open]>summary{border-bottom:1px solid var(--hair); color:var(--ink)}
  .disc .raw,.disc .refine{margin:12px 13px 13px}
  .disc .tiersel{margin:12px 13px 13px; width:calc(100% - 26px)}
  .disc .refine{display:flex; flex-direction:column; gap:9px}

  ::-webkit-scrollbar{width:10px} ::-webkit-scrollbar-thumb{background:var(--strong); border-radius:8px}
</style>
</head>
<body>
<nav>
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L20 7 L20 17 L12 22 L4 17 L4 7 Z" stroke="#fffaf0" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="#fffaf0"/></svg></span>
    <div><div class="name">CRUX</div><div class="sub">CONTEXT BRAIN</div></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-v="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg> Overview</button>
    <button class="tab" data-v="kb"><svg viewBox="0 0 24 24"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z"/><path d="M3 12l9 4.5L21 12"/><path d="M3 16.5 12 21l9-4.5"/></svg> Knowledge Base <span class="badge" id="t-kb">0</span></button>
    <button class="tab" data-v="decisions"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Review <span class="badge" id="t-dec">0</span></button>
    <button class="tab" data-v="activity"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h8l-1 8 10-12h-8l1-8Z"/></svg> Activity</button>
  </div>
  <div class="navright">
    <span class="status">Local · <b>READY</b></span>
    <span class="who"><span class="av" id="av">U</span><span id="whoname">You</span></span>
  </div>
</nav>

<div id="app" class="wrap"></div>
<footer>CRUX · LOCAL-FIRST CONTEXT LAYER · YOUR DATA NEVER LEAVES THIS MACHINE</footer>

<div id="scrim"></div>
<div id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
// team mode: a leader token (from ?token=… or saved) unlocks validation actions.
const _token=(()=>{const t=new URL(location.href).searchParams.get("token");
  if(t){localStorage.setItem("crux_token",t);} return localStorage.getItem("crux_token")||"";})();
const api=async(u,o)=>{o=o||{}; o.headers=Object.assign({}, o.headers||{}, _token?{"x-crux-token":_token}:{}); return (await fetch(u,o)).json();};
const post=(u,b)=>api(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b||{})});
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rel=iso=>{if(!iso)return"";const d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+"m ago";
  if(d<86400)return Math.floor(d/3600)+"h ago";return Math.floor(d/86400)+"d ago";};
const CORE=["decision","constraint"], MID=["architecture","design"], LEAF=["reference","context","exploration"];

let state={view:"overview", items:[], inbox:[], working:[], conflicts:[], counts:{}, stats:{}, feed:[], expanded:{},
  kbSel:null, kbMode:"tier", kbQuery:"", kbRelated:{}, leader:true,
  lenses:[], kbLens:null, lensIds:null};

async function load(){
  const [it,rv,st,fd,ln]=await Promise.all([
    api("/items"), api("/review"), api("/stats"), api("/feed?limit=20"), api("/lenses")]);
  state.items=it.items; state.inbox=rv.inbox||[]; state.conflicts=rv.conflicts||[];
  state.counts=rv.counts||{}; state.working=state.inbox;  // back-comp for overview
  state.stats=st; state.feed=fd.usages; state.lenses=(ln&&ln.lenses)||[];
  _sig=`${st.crystals}|${st.fluid}|${st.injections}`;
  document.getElementById("t-kb").textContent=state.items.filter(i=>i.scope==="main").length;
  const need=state.inbox.length;
  const td=document.getElementById("t-dec"); td.textContent=need;
  document.querySelector('[data-v="decisions"]').classList.toggle("alert", (state.counts.conflict||0)>0);
  render();
}
// Auto-refresh: poll lightweight /stats; reload only when something changed, and
// never while the user is typing/selecting (so it can't disrupt an edit).
let _sig="";
async function poll(){
  if(document.hidden) return;
  const ae=document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  try{
    const st=await api("/stats");
    const sig=`${st.crystals}|${st.fluid}|${st.injections}`;
    if(_sig && sig!==_sig) await load();
  }catch(e){}
}
setInterval(poll, 5000);
function setView(v){state.view=v;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  render(); window.scrollTo(0,0);}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)setView(b.dataset.v);});

function render(){({overview:vOverview,kb:vKB,decisions:vDecisions,activity:vActivity}[state.view])();}

/* ---------------- OVERVIEW ---------------- */
function vOverview(){
  const need=state.inbox.length;
  const flagged=(state.counts.conflict||0)+(state.counts.attention||0);
  const date=new Date().toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"}).toUpperCase();
  const attn=state.inbox.slice(0,2);
  const hero = !state.leader
    ? `<h1 class="display">Capture & use your team's knowledge.</h1>
       <p>Anything you capture is <b>proposed</b> to the team leader for review. Your agents automatically pull the verified knowledge below.</p>
       <div class="row"><button class="btn primary" onclick="setView('kb')">Browse knowledge →</button></div>`
    : need
    ? `<h1 class="display">${need} thing${need>1?'s':''} in your inbox.</h1>
       <p>${flagged?`${flagged} need${flagged>1?'':'s'} a closer look; the rest are clean and promote in one click.`:`All clean — promote them in one click.`} A quick review keeps your agents pulling only what's true.</p>
       <div class="row"><button class="btn primary" onclick="setView('decisions')">Review now →</button>
       <button class="btn ghost" onclick="setView('kb')">or browse everything</button></div>`
    : `<h1 class="display">You're all clear.</h1>
       <p>Nothing to review. Everything captured is either verified or settling in your working layer. Capture something below whenever a decision or constraint comes up.</p>`;
  const proposeWord = state.leader ? "Capture" : "Propose";
  app(`
    <div class="crumb">WORKSPACE <b>//</b> LOCAL <b>//</b> OVERVIEW</div>
    <div class="hero">
      <div class="kicker">${date} · LOCAL-FIRST</div>
      ${hero}
      <div class="capture" style="position:relative">
        <input id="cap" placeholder="${proposeWord} a decision, constraint, or note…" autocomplete="off"/>
        <button class="btn primary" onclick="doCapture()">${proposeWord}</button>
        <div id="res"></div>
      </div>
    </div>
    <div class="cols">
      ${state.leader&&attn.length?attn.map(renderAttn).join(""):`<div class="card" style="grid-column:span 2"><div class="tagline teal">VERIFIED KNOWLEDGE</div><h3>${state.stats.crystals||0} facts your agents trust</h3><div class="desc">${state.leader?'Captured notes you promote become verified knowledge your agents prioritize.':'Browse the Knowledge Base to see what the team has verified.'}</div></div>`}
      <div class="card act">
        <h4>Recent activity <span class="live">LIVE</span></h4>
        ${feedHTML(state.feed.slice(0,5)) || '<div class="muted2" style="font-size:13px">No injections yet. When an agent pulls your context, it shows here.</div>'}
      </div>
    </div>
    <div class="strip">
      <div class="stat"><div class="l">Knowledge base</div><div class="v">${state.stats.crystals||0} verified</div></div>
      <div class="stat"><div class="l">Working layer</div><div class="v">${state.stats.fluid||0} notes</div></div>
      <div class="stat"><div class="l">Agent injections</div><div class="v">${state.stats.injections||0}<small>payoff</small></div></div>
    </div>`);
  wireCapture();
}
function renderAttn(it){
  const accent=it.status==='conflict'?'accent-coral':it.status==='attention'?'accent-peach':'accent-teal';
  const tagcls=it.status==='conflict'?'coral':it.status==='attention'?'peach':'teal';
  const tag=it.status==='conflict'?'⚠ CONFLICT':it.status==='attention'?'● NEEDS A LOOK':'● WORKING · '+esc(it.type);
  const clean=it.status==='clean';
  return `<div class="card ${accent}"><div class="tagline ${tagcls}">${tag}</div>
    <h3>${esc(it.title)}</h3><div class="desc">${esc(it.implication||it.summary||'')}</div>
    <div class="foot"><button class="btn sm ${clean?'teal':'primary'}" onclick="${clean?`promote('${it.id}')`:`setView('decisions')`}">${clean?'Verify →':'Review →'}</button>
    <button class="btn sm ghost" onclick="setView('decisions')">Open</button></div></div>`;
}

/* ---------------- KNOWLEDGE BASE (explorer) ---------------- */
const TIER_LABEL={core:"Core Strategy",mid:"Mid Planning",leaf:"Leaf / Operational"};
const TIER_DESC={core:"company mission, vision & strategy",mid:"product decisions, roadmap & architecture",leaf:"operational facts & day-to-day work"};
const TIER_ORDER=["core","mid","leaf"];
const DOMAIN_LABEL={product:"Product",technical:"Technical",user:"Users",market:"Market",competitor:"Competitors",legal:"Legal",process:"Process",other:"Other"};
const DOMAIN_ORDER=["product","technical","user","market","competitor","legal","process","other"];

function vKB(){
  const main=state.items.filter(i=>i.scope==="main");
  if(!main.length){
    app(`<div class="crumb">WORKSPACE <b>//</b> LOCAL <b>//</b> KNOWLEDGE BASE</div>
      <h1 class="head display">Knowledge explorer</h1>
      <div class="empty"><div class="big">Nothing verified yet</div>Promote working notes in Review to build your knowledge base.</div>`);
    return;
  }
  // a lens gathers the relevant slice of the graph; "All" shows everything
  let shown = main;
  if(state.kbLens!=null && state.lensIds){
    const set=new Set(state.lensIds);
    shown = main.filter(i=>set.has(i.id));
  }
  const sel = shown.find(i=>i.id===state.kbSel) || shown[0] || main[0];
  state.kbSel = sel ? sel.id : null;
  app(`
    <div class="crumb">WORKSPACE <b>//</b> LOCAL <b>//</b> KNOWLEDGE BASE</div>
    <h1 class="head display">Knowledge explorer</h1>
    <p class="sub">Browse your verified knowledge and walk its connections. Lenses gather a relevant slice across domains — a fact appears in every lens it's relevant to.</p>
    <div class="lensbar">
      <button class="lens ${state.kbLens==null?'on':''}" onclick="selectLens(null)">All</button>
      ${state.lenses.map(l=>`<button class="lens ${state.kbLens===l.id?'on':''}" onclick="selectLens(${l.id})" title="${esc(l.intent||'')}">${esc(l.name)}${state.leader?` <span class="lx" onclick="event.stopPropagation();delLens(${l.id})">×</span>`:''}</button>`).join("")}
      ${state.leader?`<button class="lens new" onclick="newLens()">+ New lens</button>`:''}
    </div>
    <div class="kbwrap">
      <div class="kbnav">
        <input class="kbsearch" id="kbq" placeholder="Filter…" oninput="kbFilter()" value="${esc(state.kbQuery||'')}"/>
        <div class="kbmodes">
          <button class="kbmode ${state.kbMode==='tier'?'on':''}" onclick="setKbMode('tier')">By tier</button>
          <button class="kbmode ${state.kbMode==='domain'?'on':''}" onclick="setKbMode('domain')">By domain</button>
          <button class="kbmode ${state.kbMode==='topic'?'on':''}" onclick="setKbMode('topic')">By topic</button>
        </div>
        <div class="kblist">${shown.length?kbNav(shown):'<div class="muted2" style="font-size:13px;padding:8px">No facts match this lens yet.</div>'}</div>
      </div>
      <div class="kbdetail">${sel?kbDetail(sel):'<div class="muted2">Nothing here yet.</div>'}</div>
    </div>`);
  if(state.kbQuery) kbFilter();
}
async function selectLens(id){
  state.kbLens=id; state.kbSel=null;
  if(id==null){ state.lensIds=null; render(); return; }
  state.lensIds=[]; render();
  const r=await api(`/lenses/${id}/items`); state.lensIds=r.ids||[]; render();
}
async function newLens(){
  const name=prompt("Lens name (e.g. Offline Sync, Marketing Campaign):"); if(!name) return;
  const intent=prompt("What is this lens about? (one line — helps it gather the right facts)")||"";
  await post("/lenses",{name,intent}); toast("✓ Lens created");
  const ln=await api("/lenses"); state.lenses=ln.lenses||[]; render();
}
async function delLens(id){
  if(!confirm("Delete this lens? (facts are untouched — a lens is just a view)")) return;
  await fetch(`/lenses/${id}`,{method:"DELETE",headers:_token?{"x-crux-token":_token}:{}});
  if(state.kbLens===id){state.kbLens=null;state.lensIds=null;}
  const ln=await api("/lenses"); state.lenses=ln.lenses||[]; render();
}
window.selectLens=selectLens; window.newLens=newLens; window.delLens=delLens;

function conflictIds(){
  const s=new Set(); (state.conflicts||[]).forEach(c=>{s.add(c.a.id);s.add(c.b.id);}); return s;
}
function kbDomainGroups(main){
  return DOMAIN_ORDER.map(d=>[DOMAIN_LABEL[d],'',main.filter(i=>(i.domain||'other')===d)])
    .filter(g=>g[2].length);
}
function kbNav(main){
  const conf=conflictIds();
  const groups = state.kbMode==='topic' ? kbTopicGroups(main)
               : state.kbMode==='domain' ? kbDomainGroups(main)
               : kbTierGroups(main);
  return groups.map(([label,sub,items])=>
    `<div class="kbgroup"><div class="kbglabel">${esc(label)}${sub?` · <span>${esc(sub)}</span>`:''} · ${items.length}</div>
     ${items.map(i=>navItem(i,conf)).join("")}</div>`).join("");
}
function kbTierGroups(main){
  return TIER_ORDER.map(t=>[TIER_LABEL[t],TIER_DESC[t],main.filter(i=>(i.tier||'leaf')===t)])
    .filter(g=>g[2].length);
}
function kbTopicGroups(main){
  const byTag={};
  main.forEach(i=>{const tags=(i.tags||[]).length?i.tags:['untagged'];
    tags.forEach(t=>{(byTag[t]=byTag[t]||[]).push(i);});});
  return Object.entries(byTag).sort((a,b)=>b[1].length-a[1].length).map(([t,items])=>[t,'',items]);
}
function navItem(i,conf){
  const edges=(i.edges?i.edges.extends.length+i.edges.extended_by.length:0);
  const txt=((i.title||'')+' '+(i.summary||'')+' '+(i.tags||[]).join(' ')).toLowerCase();
  return `<div class="navitem ${i.id===state.kbSel?'sel':''}" data-text="${esc(txt)}" onclick="selectKb('${i.id}')">
    <div class="nt">${esc(i.title||'')}</div>
    <div class="ni"><span class="ipill tier-${i.tier||'leaf'}">${TIER_LABEL[i.tier||'leaf'].split(' ')[0]}</span>
      ${conf.has(i.id)?'<span class="cdot c-conflict" title="has a conflict"></span>':''}
      ${edges?`<span class="nbadge">⋯${edges}</span>`:''}
      ${i.usage_count?`<span class="nbadge">⚡${i.usage_count}</span>`:''}</div>
  </div>`;
}
function kbDetail(it){
  const see=state.kbRelated[it.id];
  const edges=it.edges||{extends:[],extended_by:[]};
  const chip=x=>`<span class="ep" onclick="selectKb('${x.id}')">${esc(x.title)}</span>`;
  const conns=[];
  if(edges.extends.length) conns.push(`<div class="edge"><span class="el">extends →</span>${edges.extends.map(chip).join("")}</div>`);
  if(edges.extended_by.length) conns.push(`<div class="edge"><span class="el">extended by ←</span>${edges.extended_by.map(chip).join("")}</div>`);
  if((edges.related||[]).length) conns.push(`<div class="edge"><span class="el">related</span>${edges.related.map(chip).join("")}</div>`);
  if(see===undefined) conns.push(`<div class="edge"><span class="el">see also</span><span class="muted2" style="font-size:12px">loading…</span></div>`);
  else if(see.length) conns.push(`<div class="edge"><span class="el">see also</span>${see.map(chip).join("")}</div>`);
  const connBlock = conns.length
    ? `<div class="dsection"><div class="pl">CONNECTIONS</div><div class="edges">${conns.join("")}</div></div>`
    : `<div class="dsection"><div class="pl">CONNECTIONS</div><div class="muted2" style="font-size:13px">No links yet. In Review, use “Extend” to connect related facts.</div></div>`;
  return `
    <div class="dhead">
      <span class="tier teal">◆ VERIFIED · ${esc(it.type)}</span>
      <span class="ipill tier-${it.tier||'leaf'}">${TIER_LABEL[it.tier||'leaf']}</span>
      <span class="ipill">${DOMAIN_LABEL[it.domain||'other']}</span>
    </div>
    <h2 class="dtitle">${esc(it.title||'')}</h2>
    <div class="dstmt">${esc(it.summary||it.title||'')}</div>
    ${it.usage_count?`<div class="usedb">⚡ used ${it.usage_count}× by agents${it.last_used?` · last ${rel(it.last_used)}`:''}</div>`:''}
    ${connBlock}
    <div class="dsection"><div class="pl">ORIGINAL SOURCE${it.source?` · ${esc(it.source)}`:''}</div>
      <div class="raw">${esc(it.raw_content||it.summary||it.title)}</div></div>
    <div class="dsection"><div class="pl">DETAILS</div>
      <div class="meta"><div><b>id</b> ${it.id.slice(0,8)}</div>
        <div><b>tier</b> ${TIER_LABEL[it.tier||'leaf']}</div>
        <div><b>domain</b> ${DOMAIN_LABEL[it.domain||'other']}</div>
        ${it.promoted_at?`<div><b>verified</b> ${it.promoted_at.slice(0,10)}</div>`:''}
        <div><b>confidence</b> ${Math.round((it.confidence||0)*100)}%</div></div>
      <div class="tags">${(it.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div></div>
    ${state.leader?`
    <div class="refine" id="kbedit" style="display:none;margin:10px 0 14px">
      <input id="et" value="${esc(it.title)}" placeholder="Title…"/>
      <input id="es" value="${esc(it.summary||'')}" placeholder="Summary…"/>
      <button class="btn teal" onclick="saveEdit('${it.id}')">Save changes</button></div>
    <div class="dactions" style="margin-top:14px">
      <button class="btn sm out" onclick="document.getElementById('kbedit').style.display='flex'">✎ Edit</button>
      <button class="btn sm out" onclick="demote('${it.id}')">↩ Return to working</button>
      <button class="btn sm danger" onclick="archive('${it.id}')">Archive</button>
    </div>`:`<div class="muted2" style="font-size:12px;margin-top:14px">Read-only — the team leader maintains the knowledge base.</div>`}`;
}
function selectKb(id){
  state.kbSel=id; render();
  if(state.kbRelated[id]===undefined){
    api(`/related?id=${id}`).then(r=>{state.kbRelated[id]=r.items||[]; if(state.view==='kb') render();});
  }
}
function setKbMode(m){state.kbMode=m; render();}
function kbFilter(){
  const q=(document.getElementById('kbq').value||'').toLowerCase().trim();
  state.kbQuery=q;
  document.querySelectorAll('.kbnav .navitem').forEach(n=>{
    n.style.display = (!q || n.dataset.text.includes(q)) ? '' : 'none';});
  document.querySelectorAll('.kbnav .kbgroup').forEach(g=>{
    const any=[...g.querySelectorAll('.navitem')].some(n=>n.style.display!=='none');
    g.style.display = any ? '' : 'none';});
}
window.selectKb=selectKb; window.setKbMode=setKbMode; window.kbFilter=kbFilter;

/* ---------------- REVIEW / DECISIONS ---------------- */
function vDecisions(){
  const inbox=state.inbox, n=inbox.length;
  const clean=state.counts.clean||0, attn=state.counts.attention||0, conf=state.counts.conflict||0;
  const inboxIds=new Set(inbox.map(i=>i.id));
  const extra=state.conflicts.filter(c=>!inboxIds.has(c.a.id)&&!inboxIds.has(c.b.id));
  app(`
    <div class="crumb">WORKSPACE <b>//</b> LOCAL <b>//</b> REVIEW</div>
    <h1 class="head display">Review inbox</h1>
    <p class="sub">Captured notes wait here. Clean ones promote in one click; anything that conflicts with or duplicates what you already know is flagged. Nothing reaches your agents until you verify it.</p>
    ${!n&&!extra.length?`<div class="empty"><div class="big">Inbox zero ✦</div>Nothing waiting. Capture as you work.</div>`:''}
    ${n?`<div class="inboxbar">
      <div class="counts">
        ${conf?`<span class="cdot c-conflict"></span><span>${conf} conflict${conf>1?'s':''}</span>`:''}
        ${attn?`<span class="cdot c-attention"></span><span>${attn} to check</span>`:''}
        ${clean?`<span class="cdot c-clean"></span><span>${clean} clean</span>`:''}
      </div>
      ${clean?`<button class="btn teal sm" onclick="promoteClean()">✓ Promote all ${clean} clean</button>`:''}
    </div>
    ${inbox.map(inboxRow).join("")}`:''}
    ${extra.length?`<div class="sectlabel">CONTRADICTIONS IN VERIFIED KNOWLEDGE · ${extra.length}</div>${extra.map(conflictCard).join("")}`:''}`);
}
function conflictCard(c){
  const reason = c.reason ? ` · ${esc(c.reason)}` : "";
  return `<div class="dcard">
    <div class="top"><span class="chip coral">⚠ POSSIBLE CONTRADICTION · ${Math.round(c.similarity*100)}% similar${reason}</span></div>
    <div class="compare">
      <div class="pane a"><div class="pl">Option A · ${esc(c.a.type)}${c.a.scope==='main'?' · verified':''}</div><div class="pt">${esc(c.a.summary||c.a.title)}</div></div>
      <div class="arrow">⇄</div>
      <div class="pane b"><div class="pl">Option B · ${esc(c.b.type)}${c.b.scope==='main'?' · verified':''}</div><div class="pt">${esc(c.b.summary||c.b.title)}</div></div>
    </div>
    <div class="dfoot"><span class="mono" style="font-size:11px;color:var(--muted2)">Keeping one supersedes the other (history is kept)</span>
      <div class="dactions">
        <button class="btn sm out" onclick="supersede('${c.b.id}','${c.a.id}')">Keep A</button>
        <button class="btn sm out" onclick="supersede('${c.a.id}','${c.b.id}')">Keep B</button>
        <button class="btn sm ghost" onclick="dismissConflict(${c.id})">Not a conflict</button>
      </div></div></div>`;
}
async function dismissConflict(id){await post(`/conflicts/${id}/dismiss`,{}); toast("Dismissed — won't resurface"); await load();}
async function saveEdit(id){
  const t=document.getElementById('et').value.trim(), s=document.getElementById('es').value.trim();
  await post(`/items/${id}/edit`,{title:t||null,summary:s||null});
  toast("✓ Edited & re-embedded"); closeDrawer(); await load();}
window.dismissConflict=dismissConflict; window.saveEdit=saveEdit;
function inboxRow(it){
  const open=!!state.expanded[it.id];
  return `<div class="irow s-${it.status} ${open?'open':''}">
    <div class="ihead" onclick="toggleRow('${it.id}')">
      <span class="cdot c-${it.status}"></span>
      <div class="imain">
        <div class="ititle">${esc(it.title||it.summary||'')}</div>
        <div class="imeta"><span class="ipill tier-${it.tier||'leaf'}">${(TIER_LABEL[it.tier||'leaf']||'Leaf')}</span><span class="ipill">${DOMAIN_LABEL[it.domain||'other']}</span><span class="ipill">${esc(it.type)}</span>${esc(it.implication||'')}</div>
      </div>
      <span class="iwhen mono">${rel(it.captured_at)}</span>
      ${it.status==='clean'?`<button class="btn sm teal" onclick="event.stopPropagation();promote('${it.id}')">Promote</button>`:''}
      <span class="chev">${open?'▴':'▾'}</span>
    </div>
    ${open?inboxDeep(it):''}
  </div>`;
}
function inboxDeep(it){
  const r=it.fit&&it.fit.related, rel=it.fit?it.fit.relation:'new';
  const sim=r&&r.similarity?Math.round(r.similarity*100)+'%':'';
  const reason=it.fit&&it.fit.reason?esc(it.fit.reason):'';
  const where=r?(r.scope==='main'?'VERIFIED':'WORKING'):'';
  const existBox=(label,cls)=>`<div class="fitbox ${cls||''}">
      <div class="pl">${label}</div>
      <div class="exist"><b>${esc(r.title||'')}</b>${r.summary&&r.summary!==r.title?'<div class="es">'+esc(r.summary)+'</div>':''}</div></div>`;
  let fit='', acts='';
  if(rel==='update'&&r){
    fit=existBox(`UPDATES ${where} · ${sim}`,'fb-coral')
      +`<div class="reason"><b>Why —</b> ${reason||'this changes or contradicts the existing fact.'}</div>
        <div class="reason"><b>If you replace —</b> the old version is superseded (kept in history).</div>`;
    acts=`<button class="btn sm out" onclick="extendItem('${it.id}','${r.id}')">No, it extends</button>
      <button class="btn sm teal" onclick="supersede('${r.id}','${it.id}')">✓ Replace existing</button>`;
  } else if(rel==='extend'&&r){
    fit=existBox(`EXTENDS ${where} · ${sim}`)
      +`<div class="reason"><b>Why —</b> ${reason||'adds detail to the existing fact; both stay true.'}</div>
        <div class="reason"><b>If you extend —</b> the two are linked; both kept, your knowledge gets richer.</div>`;
    acts=`<button class="btn sm out" onclick="supersede('${r.id}','${it.id}')">No, it's an update</button>
      <button class="btn sm out" onclick="promoteRefined('${it.id}')">Keep separate</button>
      <button class="btn sm teal" onclick="extendItem('${it.id}','${r.id}')">✓ Extend &amp; promote</button>`;
  } else if(rel==='duplicate'&&r){
    fit=existBox(`NEAR-DUPLICATE OF ${where} · ${sim}`)
      +`<div class="reason"><b>Why —</b> ${reason||'almost identical to an existing fact — you may have it already.'}</div>`;
    acts=`<button class="btn sm out" onclick="supersede('${r.id}','${it.id}')">Replace existing</button>
      <button class="btn sm teal" onclick="promoteRefined('${it.id}')">Keep anyway</button>`;
  } else {
    fit=`<div class="reason"><b>New —</b> nothing similar yet. Promoting adds a fresh ${esc(it.type||'note')} to your Knowledge Base.</div>`;
    acts=`<button class="btn sm teal" onclick="promoteRefined('${it.id}')">✓ Verify &amp; promote</button>`;
  }
  const tier=it.tier||'leaf';
  const opt=(t)=>`<option value="${t}" ${t===tier?'selected':''}>${TIER_LABEL[t]} — ${TIER_DESC[t]}</option>`;
  return `<div class="ideep">
    <div class="kv"><div class="pl">EXTRACTED KNOWLEDGE</div><div class="extracted">${esc(it.summary||it.title)}</div></div>
    ${fit}
    <div class="discs">
      <details class="disc"><summary>Show original text</summary><div class="raw">${esc(it.raw_content||it.summary||it.title)}</div></details>
      <details class="disc"><summary>Change tier — currently <b>${TIER_LABEL[tier]}</b></summary>
        <select id="rtier-${it.id}" class="tiersel">${opt('core')}${opt('mid')}${opt('leaf')}</select></details>
      <details class="disc"><summary>Edit title / summary</summary>
        <div class="refine">
          <input id="rt-${it.id}" value="${esc(it.title||'')}" placeholder="Title…"/>
          <input id="rs-${it.id}" value="${esc(it.summary||'')}" placeholder="Summary…"/>
        </div></details>
    </div>
    <div class="dfoot"><span class="mono" style="font-size:11px;color:var(--muted2)">${it.id.slice(0,8)}${it.source?' · '+esc(it.source):''}</span>
      <div class="dactions">
        <button class="btn sm danger" onclick="archive('${it.id}')">Discard</button>
        ${acts}
      </div></div>
  </div>`;
}
function toggleRow(id){state.expanded[id]=!state.expanded[id]; render();}
async function promoteClean(){const r=await post("/promote-clean",{}); toast(`✓ Promoted ${r.promoted} clean item${r.promoted===1?'':'s'}`); await load();}
async function extendItem(newId,targetId){await post(`/items/${newId}/extend`,{target_id:targetId,promote:true});
  toast("✓ Linked & promoted — both kept"); await load();}
window.toggleRow=toggleRow; window.promoteClean=promoteClean; window.extendItem=extendItem;

/* ---------------- ACTIVITY ---------------- */
function vActivity(){
  app(`
    <div class="crumb">WORKSPACE <b>//</b> LOCAL <b>//</b> ACTIVITY</div>
    <h1 class="head display">Your past self, helping you now</h1>
    <p class="sub">Every time an agent pulls your context through the CRUX hook, it lands here. This is the value you can usually never see.</p>
    <div class="card" style="max-width:760px">
      <h4 style="font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 18px">Injection feed</h4>
      ${feedHTML(state.feed) || '<div class="muted2" style="font-size:14px">No injections yet. Run <span class="mono">crux install-hook</span>, then start a task in Claude Code.</div>'}
    </div>`);
}
function feedHTML(feed){
  if(!feed||!feed.length) return "";
  return feed.map(u=>`<div class="ev">
    <span class="tag" style="background:${u.scope==='main'?'var(--teal-bg)':'var(--peach-bg)'};color:${u.scope==='main'?'var(--teal)':'var(--peach)'}">${u.scope==='main'?'VERIFIED':'working'}</span>
    <span class="when">${rel(u.used_at)}</span>
    <div class="txt"><b>${esc(u.title)}</b> was injected for “${esc((u.query||'').slice(0,70))}”</div></div>`).join("");
}

/* ---------------- actions ---------------- */
function app(html){document.getElementById("app").innerHTML=html;}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("on"),2200);}

async function doCapture(){const i=document.getElementById("cap");const v=i.value.trim();if(!v)return;
  i.value=""; document.getElementById("res").classList.remove("on");
  if(v.length>400||v.includes("\n")){ // long paste / document → async multi-fact ingest
    await post("/ingest",{content:v,source_type:"paste"});
    toast("● Ingesting document in the background…"); setView("decisions");
    for(let i=0;i<6;i++){await new Promise(r=>setTimeout(r,1200)); await load();}  // poll as facts appear
    return;}
  const it=await post("/capture",{content:v}); toast("● Captured to working layer");
  await load(); setTimeout(()=>openItem(it.id),200);}
function wireCapture(){const i=document.getElementById("cap"); if(!i)return;
  i.addEventListener("keydown",e=>{if(e.key==="Enter")doCapture();});
  wireSearch();}
let stmr; function wireSearch(){const i=document.getElementById("cap"); if(!i)return;
  i.addEventListener("input",e=>{clearTimeout(stmr);const q=e.target.value.trim();const box=document.getElementById("res");
    if(q.length<3){box.classList.remove("on");return;}
    stmr=setTimeout(async()=>{const {items}=await api("/search?limit=6&q="+encodeURIComponent(q));
      if(!items.length){box.classList.remove("on");return;}
      box.innerHTML=items.map(r=>`<div class="rrow" onclick="openItem('${r.id}')">
        <span class="dot" style="background:${r.scope==='main'?'var(--teal)':'var(--peach)'}"></span>
        <span style="flex:1"><b>${esc(r.title)}</b><span>${esc(r.summary||'')}</span></span>
        <span class="sc">${r.score.toFixed(3)}</span></div>`).join("");
      box.classList.add("on");},180);});}

async function promote(id){await post(`/items/${id}/promote`,{}); toast("✓ Verified — agents will prioritize it"); await load();}
async function promoteRefined(id){
  const t=document.getElementById("rt-"+id), s=document.getElementById("rs-"+id), tr=document.getElementById("rtier-"+id);
  await post(`/items/${id}/promote`,{title:(t&&t.value.trim())||null, summary:(s&&s.value.trim())||null, tier:(tr&&tr.value)||null});
  toast("✓ Verified & promoted"); await load();}
async function archive(id){await post(`/items/${id}/archive`,{}); toast("Discarded"); closeDrawer(); await load();}
async function demote(id){await post(`/items/${id}/demote`,{}); toast("Returned to working layer"); closeDrawer(); await load();}
async function supersede(oldId,newId){await fetch(`/items/${oldId}/supersede?new_id=${newId}`,{method:"POST"});
  toast("Resolved — older version kept in history"); await load();}

/* ---------------- drawer ---------------- */
function edgesHTML(e){
  if(!e||(!e.extends.length&&!e.extended_by.length)) return "";
  const line=(label,arr)=>arr.length?`<div class="edge"><span class="el">${label}</span>${arr.map(x=>`<span class="ep" onclick="openItem('${x.id}')">${esc(x.title)}</span>`).join("")}</div>`:"";
  return `<div class="edges">${line('extends →',e.extends)}${line('extended by ←',e.extended_by)}</div>`;
}
function openItem(id){const it=state.items.find(x=>x.id===id)||state.working.find(x=>x.id===id);if(!it)return;
  const isM=it.scope==="main";
  document.getElementById("drawer").innerHTML=`
    <span class="tier ${isM?'teal':'peach'}">${isM?'◆ VERIFIED · main graph':'● WORKING · provisional'} · ${esc(it.type)}</span>
    <h2>${esc(it.title)}</h2><div class="ds">${esc(it.summary||'')}</div>
    ${it.usage_count?`<div class="usedb">⚡ used ${it.usage_count}× by agents${it.last_used?` · last ${rel(it.last_used)}`:''}</div>`:''}
    <div class="meta">
      <div><b>id</b> ${it.id.slice(0,8)}</div>
      <div><b>tier</b> ${TIER_LABEL[it.tier||'leaf']}</div>
      <div><b>captured</b> ${(it.captured_at||'').slice(0,10)}</div>
      ${it.promoted_at?`<div><b>verified</b> ${it.promoted_at.slice(0,10)}</div>`:''}
      ${it.source?`<div><b>source</b> ${esc(it.source)}</div>`:''}
      <div><b>confidence</b> ${Math.round((it.confidence||0)*100)}%</div></div>
    ${edgesHTML(it.edges)}
    <div class="tags">${(it.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div>
    <div class="refine" id="edit-${it.id}" style="display:none;margin-bottom:14px">
      <input id="et" value="${esc(it.title)}" placeholder="Title…"/>
      <input id="es" value="${esc(it.summary||'')}" placeholder="Summary…"/>
      <button class="btn teal" onclick="saveEdit('${it.id}')">Save changes</button>
    </div>
    <div class="acts">
      ${isM?`<button class="btn out" onclick="demote('${it.id}')">↩ Return to working</button>`
            :`<button class="btn teal" onclick="promote('${it.id}');closeDrawer()">✓ Verify &amp; promote</button>`}
      <button class="btn out" onclick="document.getElementById('edit-${it.id}').style.display='flex'">✎ Edit text</button>
      <button class="btn danger" onclick="archive('${it.id}')">Archive</button>
    </div>`;
  document.getElementById("drawer").classList.add("on");
  document.getElementById("scrim").classList.add("on");}
function closeDrawer(){document.getElementById("drawer").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");}
document.getElementById("scrim").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
document.addEventListener("click",e=>{const box=document.getElementById("res");
  if(box&&!e.target.closest(".capture"))box.classList.remove("on");});

window.setView=setView;window.openItem=openItem;window.doCapture=doCapture;window.promote=promote;
window.promoteRefined=promoteRefined;window.archive=archive;window.demote=demote;window.supersede=supersede;
window.closeDrawer=closeDrawer;window.toast=toast;
async function init(){
  try{ const w=await api("/api/whoami"); state.leader=!!w.leader; }catch(e){ state.leader=true; }
  applyRole();
  load();
}
function applyRole(){
  // members propose & use; only the leader validates. Hide the Review tab + the
  // role chip reflects it. (The server enforces this regardless of the UI.)
  const dec=document.querySelector('[data-v="decisions"]');
  if(dec) dec.style.display = state.leader ? "" : "none";
  const st=document.querySelector(".status");
  if(st) st.innerHTML = state.leader ? 'Leader · <b>VALIDATES KB</b>' : 'Member · <b>PROPOSE &amp; USE</b>';
  if(!state.leader && state.view==="decisions") state.view="overview";
}
init();
</script>
</body>
</html>
