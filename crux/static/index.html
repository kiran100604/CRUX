<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CRUX</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23046E2B'/%3E%3Cpath d='M9 9 L23 23 M23 9 L9 23' stroke='white' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/tokens.css">
<script>/* apply saved theme before paint to avoid a flash */
  try{if(localStorage.getItem('crux-theme')==='dark')document.documentElement.classList.add('crux-dark');}catch(e){}</script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--canvas); color:var(--body); font-family:var(--sans); font-size:16px;
    -webkit-font-smoothing:antialiased}
  .display{font-weight:600; letter-spacing:-.02em; color:var(--ink); line-height:1.05}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)} .muted2{color:var(--muted2)}
  button{font-family:var(--sans); cursor:pointer}
  a{color:inherit}

  /* nav */
  nav{position:sticky; top:0; z-index:30; height:64px; display:flex; align-items:center; gap:8px;
    padding:0 28px; background:var(--canvas); border-bottom:1px solid var(--hair)}
  .brand{display:flex; align-items:center; margin-right:22px}
  /* cruX logo lockup — brand tile (green square, white X) + wordmark, mirrors the favicon */
  .wordmark{font-weight:800; letter-spacing:-.02em; font-size:19px; color:var(--ink);
    display:inline-flex; align-items:center; gap:8px; font-family:var(--sans); user-select:none}
  .wordmark .tile{width:23px; height:23px; border-radius:7px; background:var(--accent-solid);
    display:inline-grid; place-items:center; flex:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .wordmark .tile svg{width:13px; height:13px}
  .wordmark .tile svg path{stroke:#fff; stroke-width:3.2; stroke-linecap:round}
  .tabs{display:flex; gap:2px}
  /* GitHub-style tabs: text + underline-on-active, not a filled pill */
  .tab{border:none; background:none; color:var(--body); font-size:14px; font-weight:500;
    padding:7px 11px; border-radius:var(--r-sm); display:flex; align-items:center; gap:7px;
    position:relative}
  .tab svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round; flex:none}
  .tab:hover{background:var(--soft)}
  .tab.on{font-weight:600; color:var(--ink)}
  .tab.on::after{content:""; position:absolute; left:11px; right:11px; bottom:-15px; height:2px;
    background:#fd8c73; border-radius:2px}
  .tab .badge{font-family:var(--mono); font-size:11px; background:var(--strong); color:var(--muted);
    padding:1px 7px; border-radius:var(--pill)}
  .tab.on .badge{background:var(--strong); color:var(--body)}
  .tab.alert .badge{background:var(--coral); color:#fff}
  .navright{margin-left:auto; display:flex; align-items:center; gap:14px}
  .themebtn{width:30px; height:30px; border:1px solid var(--hair); background:var(--canvas); color:var(--muted);
    border-radius:var(--pill); font-size:15px; line-height:1; display:grid; place-items:center; transition:.15s}
  .themebtn:hover{border-color:var(--muted2); color:var(--ink)}
  .pinbtn{display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 13px;
    border:1px solid var(--hair); background:var(--canvas); color:var(--muted);
    border-radius:var(--pill); font-family:inherit; font-size:13px; font-weight:500;
    line-height:1; cursor:pointer; white-space:nowrap; transition:.15s}
  .pinbtn svg{flex:none; opacity:.85}
  .pinbtn:hover{border-color:var(--teal); color:var(--ink); background:var(--paper)}
  .pinbtn:disabled{opacity:.55; cursor:default}
  .pinbtn.done{border-color:var(--teal); color:var(--teal)}
  .status{font-family:var(--mono); font-size:11px; color:var(--muted); border:1px solid var(--hair);
    border-radius:var(--pill); padding:5px 11px}
  .status b{color:var(--green)}
  .who{display:flex; align-items:center; gap:8px; border:1px solid var(--hair); border-radius:var(--pill);
    padding:4px 12px 4px 4px; font-size:13px; color:var(--ink); cursor:pointer; transition:.12s}
  .who:hover{border-color:var(--muted2); background:var(--soft)}
  .who:focus-visible{outline:2px solid var(--emphasis); outline-offset:2px}
  .who .av{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;
    font-weight:600;display:grid;place-items:center}

  /* layout */
  .wrap{max-width:1180px; margin:0 auto; padding:34px 28px 80px}
  .crumb{font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--muted2);
    text-transform:uppercase; margin-bottom:22px}
  .crumb b{color:var(--muted)}

  /* hero */
  .hero{background:var(--soft); border:1px solid var(--hair); border-radius:var(--r-xl); padding:46px}
  .kicker{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted2); margin-bottom:18px}
  .hero h1{font-size:54px; margin:0 0 14px}
  .hero p{font-size:17px; color:var(--muted); max-width:620px; margin:0 0 26px; line-height:1.5}
  .row{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
  .btn{border:1px solid transparent; border-radius:var(--r-md); font-size:14px; font-weight:600; padding:0 16px; height:44px;
    display:inline-flex; align-items:center; gap:9px; cursor:pointer}
  /* primary = the ONE important/positive action per view → brand green (GitHub-style) */
  .btn.primary,.btn.teal{background:var(--accent-solid); color:var(--on-accent); border-color:rgba(0,0,0,.12)}
  .btn.primary:hover,.btn.teal:hover{background:var(--accent-solid-hover)}
  .btn.ghost{background:transparent; color:var(--info); text-decoration:none;
    padding:0 6px; font-weight:600}
  .btn.ghost:hover{text-decoration:underline; text-underline-offset:3px}
  .btn.sm{height:36px; font-size:13px; padding:0 13px}
  /* default = neutral gray, the secondary action */
  .btn.out{background:var(--canvas); border:1px solid var(--hair); color:var(--body)}
  .btn.out:hover{background:var(--soft); border-color:var(--muted2)}
  .btn.danger{background:transparent; color:var(--coral); border:1px solid var(--coral-line)}
  .btn.danger:hover{background:var(--coral); color:#fff; border-color:var(--coral)}

  .seedbox{width:100%; min-height:120px; border:1px solid var(--hair); background:var(--canvas);
    border-radius:var(--r-md); padding:14px 16px; font-size:15px; color:var(--ink); outline:none;
    font-family:var(--sans); resize:vertical; line-height:1.5}
  .seedbox:focus{border-color:var(--ink)}
  .invite{display:flex; gap:8px; align-items:center; margin-top:14px}
  .invite code{flex:1; font-family:var(--mono); font-size:12px; background:var(--soft); color:var(--ink);
    border:1px solid var(--hair); border-radius:var(--r-sm); padding:9px 11px; overflow:auto; white-space:nowrap}

  /* capture */
  .capture{display:flex; gap:10px; margin-top:24px}
  .capture input{flex:1; height:50px; border:1px solid var(--hair); background:var(--canvas);
    border-radius:var(--r-md); padding:0 18px; font-size:15px; color:var(--ink); outline:none}
  .capture input:focus{border-color:var(--ink)}

  /* grid + cards */
  .cols{display:grid; grid-template-columns:1fr 1fr 360px; gap:18px; margin-top:18px}
  @media(max-width:980px){.cols{grid-template-columns:1fr}}
  .card{background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-lg); padding:24px}
  .card.accent-peach{background:var(--peach-bg); border-color:var(--peach-line)}
  .card.accent-coral{background:var(--coral-bg); border-color:var(--coral-line)}
  .card.accent-teal{background:var(--teal-bg); border-color:var(--teal-line)}
  .tagline{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:14px}
  .tagline.coral{color:var(--coral)} .tagline.peach{color:var(--peach)} .tagline.teal{color:var(--teal)}
  .card h3{font-size:19px; color:var(--ink); margin:0 0 10px; line-height:1.3; font-weight:600; letter-spacing:-.01em}
  .card .desc{font-size:14px; color:var(--muted); line-height:1.55; margin-bottom:18px}
  .card .foot{display:flex; gap:10px; align-items:center}

  /* activity */
  .act h4{font-family:var(--sans); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin:0 0 16px; display:flex; justify-content:space-between; align-items:center}
  .live{font-family:var(--mono); font-size:10px; color:var(--green); display:flex; gap:6px; align-items:center}
  .live::before{content:""; width:7px;height:7px;border-radius:50%;background:var(--green)}
  .ev{padding:13px 0; border-top:1px solid var(--hair)}
  .ev:first-of-type{border-top:none; padding-top:0}
  .ev .tag{font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:6px; margin-right:8px}
  .ev .when{font-family:var(--mono); font-size:11px; color:var(--muted2)}
  .ev .txt{font-size:13.5px; color:var(--body); margin-top:7px; line-height:1.5}
  .ev .txt b{color:var(--ink); font-weight:600}
  .ev2{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--hair)}
  .ev2:first-of-type{border-top:none}
  .ev2 .evk{font-family:var(--mono); font-size:10px; letter-spacing:.04em; padding:3px 8px; border-radius:var(--pill); font-weight:700; flex:none}
  .ev2 .evtxt{flex:1; min-width:0; font-size:13.5px; color:var(--body); line-height:1.45; overflow:hidden; text-overflow:ellipsis}
  .ev2 .evtxt b{color:var(--ink); font-weight:600}
  .ev2 .evwhen{font-size:11px; color:var(--muted2); flex:none}
  .ev2 .evopen{font-size:12px; color:var(--info); cursor:pointer; flex:none; white-space:nowrap}
  .ev2 .evopen:hover{text-decoration:underline}
  .dumpcard.hl{box-shadow:0 0 0 3px rgba(20,48,48,.28); border-color:var(--teal-line)}

  /* stat strip */
  .strip{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--hair);
    border:1px solid var(--hair); border-radius:var(--r-lg); overflow:hidden; margin-top:18px}
  .stat{background:var(--canvas); padding:18px 22px}
  .stat .l{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted2)}
  .stat .v{font-size:22px; color:var(--ink); margin-top:6px; font-weight:600; letter-spacing:-.01em}
  .stat .v small{font-size:13px; color:var(--green); font-weight:500; margin-left:6px}

  /* lists (KB / decisions) */
  .sectlabel{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted2); margin:30px 0 12px}
  .item{display:flex; gap:14px; padding:16px 18px; background:var(--canvas); border:1px solid var(--hair);
    border-radius:var(--r-lg); margin-bottom:10px; align-items:flex-start; cursor:pointer}
  .item:hover{border-color:var(--muted2)}
  .item .bar{width:4px; align-self:stretch; border-radius:3px; flex:none}
  .bar.teal{background:var(--teal)} .bar.peach{background:var(--peach)}
  .item .main{flex:1; min-width:0}
  .item .ti{font-size:15.5px; color:var(--ink); font-weight:600; letter-spacing:-.01em}
  .item .su{font-size:13.5px; color:var(--muted); margin-top:4px; line-height:1.5}
  .item .met{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap}
  .pill{font-family:var(--mono); font-size:10.5px; padding:3px 9px; border-radius:var(--pill);
    background:var(--card); color:var(--muted)}
  .pill.type{background:var(--teal-bg); color:var(--teal)}
  .pill.use{background:var(--peach-bg); color:var(--peach)}
  .pill.src{background:none; color:var(--muted2)}

  .seg{display:inline-flex; gap:2px; background:var(--card); border-radius:var(--pill); padding:4px; margin-bottom:6px}
  .seg button{border:none; background:none; color:var(--muted); font-family:var(--mono); font-size:12px;
    padding:6px 13px; border-radius:var(--pill)}
  .seg button.on{background:var(--canvas); color:var(--ink)}
  .seg button .d{display:inline-block; width:7px;height:7px;border-radius:50%; margin-right:6px; vertical-align:middle}

  .head{font-size:30px; margin:0 0 6px}
  .sub{font-size:15px; color:var(--muted); margin:0 0 26px; max-width:680px; line-height:1.5}

  /* conflict / decision card */
  .dcard{background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-xl); padding:30px; margin-bottom:18px}
  .dcard .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:12px}
  .chip{font-family:var(--mono); font-size:11px; padding:5px 11px; border-radius:var(--r-sm)}
  .chip.coral{background:var(--coral-bg); color:var(--coral)} .chip.peach{background:var(--peach-bg); color:var(--peach)}
  .dcard h3{font-size:22px; color:var(--ink); margin:0 0 18px; letter-spacing:-.01em}
  .compare{display:grid; grid-template-columns:1fr 40px 1fr; align-items:center; gap:0}
  @media(max-width:760px){.compare{grid-template-columns:1fr; gap:10px}}
  .pane{border-radius:var(--r-md); padding:18px}
  .pane.a{background:var(--coral-bg)} .pane.b{background:var(--teal-bg)}
  .pane .pl{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px}
  .pane.a .pl{color:var(--coral)} .pane.b .pl{color:var(--teal)}
  .pane .pt{font-size:14px; color:var(--ink); line-height:1.5}
  .arrow{text-align:center; color:var(--muted2)}
  .dfoot{display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px; flex-wrap:wrap}
  .dactions{display:flex; gap:9px}
  .refine{display:flex; flex-direction:column; gap:9px; margin-top:14px}
  .refine input{height:42px; border:1px solid var(--hair); background:var(--soft); border-radius:var(--r-md);
    padding:0 14px; font-size:14px; color:var(--ink); outline:none}
  .refine input:focus{border-color:var(--ink)}

  /* drawer */
  #scrim{position:fixed; inset:0; background:rgba(20,15,5,.28); z-index:40; opacity:0; pointer-events:none; transition:.25s}
  #scrim.on{opacity:1; pointer-events:auto}
  #drawer{position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; z-index:41; background:var(--canvas);
    border-left:1px solid var(--hair); transform:translateX(100%); transition:transform .3s cubic-bezier(.4,.2,.2,1);
    overflow:auto; padding:30px}
  #drawer.on{transform:none}
  #drawer .tier{display:inline-block; font-family:var(--mono); font-size:11px; padding:5px 11px; border-radius:var(--pill); margin-bottom:16px}
  .tier.teal{background:var(--teal-bg); color:var(--teal)} .tier.peach{background:var(--peach-bg); color:var(--peach)}
  #drawer h2{font-size:24px; color:var(--ink); margin:0 0 10px; letter-spacing:-.02em; line-height:1.2}
  #drawer .ds{font-size:15px; color:var(--muted); line-height:1.6; margin-bottom:18px}
  .usedb{display:inline-flex; gap:7px; align-items:center; font-family:var(--mono); font-size:12px; color:var(--green);
    background:rgba(31,157,87,.08); border:1px solid rgba(31,157,87,.2); padding:7px 12px; border-radius:var(--r-sm); margin-bottom:18px}
  .meta{font-family:var(--mono); font-size:12px; color:var(--muted); line-height:2; margin-bottom:18px}
  .meta b{color:var(--muted2); font-weight:400}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
  .edges{margin-bottom:18px; display:flex; flex-direction:column; gap:8px}
  .edges .edge{font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .edges .el{font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted2)}
  .edges .ep{background:var(--teal-bg); color:var(--teal); border:1px solid var(--teal-line); border-radius:var(--pill);
    padding:3px 10px; cursor:pointer; font-size:12.5px}
  .edges .ep:hover{filter:brightness(.97)}
  .acts{display:flex; flex-direction:column; gap:9px}
  .acts .btn{justify-content:center; width:100%}

  /* settings drawer */
  .setsec{border-top:1px solid var(--hair); padding:20px 0 4px; margin-top:4px}
  .setsec:first-of-type{border-top:none; padding-top:0}
  .setsec .sh{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--teal); margin-bottom:6px}
  .setsec .sp{font-size:13px; color:var(--muted); line-height:1.55; margin:0 0 14px}
  .setfield{display:block; margin-bottom:12px}
  .setfield>span{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-bottom:6px}
  .setfield .set-on{font-family:var(--mono); font-size:10px; letter-spacing:.05em; color:var(--green)}
  .setfield .set-off{font-family:var(--mono); font-size:10px; letter-spacing:.05em; color:var(--muted2)}
  .setin{width:100%; height:44px; border:1px solid var(--hair); background:var(--canvas); border-radius:var(--r-md);
    padding:0 14px; font-size:14px; color:var(--ink); outline:none; font-family:var(--mono)}
  .setin:focus{border-color:var(--ink)}
  details.setadv{margin:2px 0 0} details.setadv summary{font-size:13px; color:var(--muted); cursor:pointer; padding:6px 0; list-style:none}
  details.setadv[open] summary{margin-bottom:8px}
  .chords{display:flex; flex-wrap:wrap; gap:8px}
  .chord{border:1px solid var(--hair); background:var(--canvas); color:var(--body); border-radius:10px;
    padding:9px 13px; font-family:var(--mono); font-size:12.5px; cursor:pointer; transition:.12s}
  .chord:hover{border-color:var(--muted2)}
  .chord.on{border-color:var(--emphasis); background:var(--emphasis); color:var(--on-emphasis)}
  .recorder{border:1.5px dashed var(--muted2); border-radius:10px; padding:12px 14px; font-family:var(--mono);
    font-size:13px; color:var(--ink); background:var(--canvas); cursor:text; outline:none; text-align:center; margin-top:10px}
  .recorder:focus{border-style:solid; border-color:var(--ink); background:var(--soft)}
  .vmsg{font-size:12px; color:var(--muted); margin-top:8px} .vmsg.ok{color:var(--green)} .vmsg.bad{color:var(--coral)}
  .toggle{display:flex; align-items:center; gap:12px; cursor:pointer}
  .switch{width:44px; height:26px; border-radius:var(--pill); background:var(--strong,#e3d9bf); position:relative; transition:.18s; flex:none; border:1px solid var(--hair)}
  .switch::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.18s; box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle.on .switch{background:var(--green); border-color:var(--green)}
  .toggle.on .switch::after{transform:translateX(18px)}
  .toggle .lbl{font-size:14px; color:var(--ink); font-weight:500} .toggle .lbl small{display:block; color:var(--muted); font-weight:400; font-size:12.5px; margin-top:2px}

  /* lenses (emergent topics) */
  .srcbar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 14px; padding:12px 14px;
    background:var(--soft); border:1px solid var(--hair); border-radius:var(--r-lg)}
  .srclbl{font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); flex:none}
  .srcurl{flex:1; min-width:220px; border:1px solid var(--hair); background:var(--canvas); color:var(--ink);
    border-radius:var(--r-sm); padding:8px 12px; font-size:13.5px; font-family:var(--sans)}
  .srcurl:focus{outline:none; border-color:var(--teal-line)}
  .filebtn{font-size:13px; color:var(--body); border:1px solid var(--hair); background:var(--canvas);
    border-radius:var(--r-sm); padding:7px 12px; cursor:pointer; flex:none}
  .filebtn:hover{background:var(--soft); border-color:var(--muted2)}
  .srcstatus{font-size:12px; color:var(--muted2); flex-basis:100%; min-height:0}
  .srcstatus.busy{color:var(--peach)} .srcstatus.ok{color:var(--teal)} .srcstatus.err{color:var(--coral)}
  .lensbar{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 14px}
  .lens{border:1px solid var(--hair); background:var(--canvas); color:var(--body); border-radius:var(--pill);
    padding:6px 14px; font-size:13px; cursor:pointer}
  .lens:hover{border-color:var(--muted2)}
  .lens.on{background:var(--emphasis); color:var(--on-emphasis); border-color:var(--emphasis)}
  .lens.new{border-style:dashed; color:var(--muted)}
  .lens .lx{margin-left:6px; opacity:.55} .lens .lx:hover{opacity:1; color:var(--coral)}

  /* knowledge explorer (two-pane) */
  .kbwrap{display:grid; grid-template-columns:320px 1fr; gap:18px; align-items:start; margin-top:8px}
  @media(max-width:900px){.kbwrap{grid-template-columns:1fr}}
  .kbnav{position:sticky; top:80px; background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-lg);

  .kbghead{display:flex; align-items:center; gap:8px; padding:9px 8px; border-radius:var(--r-sm); cursor:pointer; user-select:none}
  .kbghead:hover{background:var(--soft)}
  .kbghead .caret{color:var(--muted2); font-size:11px; transition:transform .15s; flex:none}
  .kbgroup.open .kbghead .caret{transform:rotate(90deg)}
  .kbglabel{flex:1; font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink); min-width:0}
  .kbglabel .gsub{color:var(--muted2); text-transform:none; letter-spacing:0; font-family:var(--sans); font-size:11px}
  .gcount{font-family:var(--mono); font-size:10px; color:var(--muted2); background:var(--soft); border-radius:var(--pill); padding:2px 8px; flex:none}
  .kbgroup.open .gcount{background:var(--strong); color:var(--body)}
  .kbgitems{display:none; padding:2px 0 6px 14px; margin-left:6px; border-left:1px solid var(--hair)}
  .kbgroup.open .kbgitems{display:block}
  /* while searching, flatten: hide headers and reveal every matching fact */
  .kbnav.searching .kbghead{display:none}
  .kbnav.searching .kbgitems{display:block; padding-left:0; margin-left:0; border-left:none}
  .navitem{padding:9px 11px; border-radius:var(--r-sm); cursor:pointer; border:1px solid transparent}
  .navitem:hover{background:var(--soft)}
  .navitem.sel{background:var(--strong); border-color:var(--hair); box-shadow:inset 2px 0 0 var(--info)}
  .navitem.sel .nt{color:var(--ink); font-weight:600}
  .navitem .nt{font-size:13.5px; color:var(--ink); font-weight:500; line-height:1.35;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .navitem .ni{display:flex; align-items:center; gap:6px; margin-top:5px}
  .nbadge{font-family:var(--mono); font-size:10px; color:var(--muted2)}
  /* tree browsing: deeper nodes read as sentence-case topics, not shouty headers */
  .treenode .kbglabel{text-transform:none; letter-spacing:.01em; font-family:var(--sans); font-size:13px; font-weight:600}
  .treenode .treenode .kbglabel{font-weight:500; color:var(--body)}
  .treepath{display:flex; flex-wrap:wrap; align-items:center; gap:5px; font-family:var(--mono); font-size:11.5px}
  .pcrumb{background:var(--soft); border-radius:var(--pill); padding:2px 9px; color:var(--body)}
  .pcrumb:last-child{background:var(--strong); color:var(--ink)}
  .psep{color:var(--muted2)}
  .kbdetail{background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-lg); padding:28px 30px}
  .dhead{display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap}
  .dtitle{font-size:25px; color:var(--ink); margin:0 0 10px; letter-spacing:-.02em; line-height:1.2}
  .dstmt{font-size:16px; color:var(--body); line-height:1.6; background:var(--soft); border:1px solid var(--hair);
    border-radius:var(--r-md); padding:15px 17px}
  .dsection{margin-top:22px}
  .dsection .pl{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted2); margin-bottom:10px}
  .kbdetail .raw{font-size:14px; color:var(--body); line-height:1.6; background:var(--soft); border:1px solid var(--hair);
    border-radius:var(--r-sm); padding:13px 15px; white-space:pre-wrap; word-break:break-word}
  .kbdetail .edges{margin-bottom:0}

  /* search results */
  #res{position:absolute; z-index:35; background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-md);
    box-shadow:0 20px 50px rgba(40,30,10,.14); margin-top:6px; width:100%; display:none; overflow:hidden}
  #res.on{display:block}
  .rrow{display:flex; gap:10px; align-items:baseline; padding:11px 16px; cursor:pointer}
  .rrow:hover{background:var(--soft)}
  .rrow .dot{width:8px;height:8px;border-radius:50%; flex:none; transform:translateY(2px)}
  .rrow b{font-size:14px; color:var(--ink); font-weight:600} .rrow span{display:block; font-size:12px; color:var(--muted); margin-top:2px}
  .rrow .sc{font-family:var(--mono); font-size:11px; color:var(--muted2)}

  .empty{text-align:center; color:var(--muted2); padding:70px 0}
  .empty .big{font-size:20px; color:var(--muted); margin-bottom:8px; font-weight:500}

  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(16px); z-index:60;
    background:var(--emphasis); color:var(--on-emphasis); border-radius:var(--r-md); padding:12px 20px; font-size:14px; opacity:0;
    transition:.3s; pointer-events:none}
  .toast.on{opacity:1; transform:translateX(-50%)}
  footer{background:var(--soft); border-top:1px solid var(--hair); padding:34px 28px; text-align:center;
    font-family:var(--mono); font-size:11px; color:var(--muted2); letter-spacing:.08em}
  /* chat view owns the viewport: no body scroll, no footer pushing it around */
  body.kb-ask{overflow:hidden}
  body.kb-ask footer{display:none}
  body.kb-ask .wrap{padding-bottom:0}
  /* review inbox */
  .inboxbar{display:flex; align-items:center; justify-content:space-between; gap:14px; margin:6px 0 16px}
  .inboxbar .counts{display:flex; align-items:center; gap:16px; font-size:13px; color:var(--muted)}
  .inboxbar .counts span{display:inline-flex; align-items:center}
  .cdot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:7px; flex:none}
  .c-clean{background:var(--green)} .c-attention{background:var(--peach)} .c-conflict{background:var(--coral)}
  .irow{border:1px solid var(--hair); border-radius:var(--r-md); background:var(--canvas); margin-bottom:10px; overflow:hidden}
  .irow.s-conflict{border-color:var(--coral-line)} .irow.s-attention{border-color:var(--peach-line)}
  .irow.open{box-shadow:0 8px 30px rgba(40,30,10,.08)}
  .ihead{display:flex; align-items:center; gap:14px; padding:15px 18px; cursor:pointer}
  .ihead:hover{background:var(--soft)}
  .ihead .cdot{margin:0}
  .imain{flex:1; min-width:0}
  .ititle{font-size:15px; color:var(--ink); font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .imeta{font-size:12.5px; color:var(--muted); margin-top:4px; display:flex; align-items:center; gap:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ipill{font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase; background:var(--card); color:var(--muted); padding:2px 7px; border-radius:var(--pill); flex:none}
  .iwhen{font-size:11px; color:var(--muted2); flex:none}
  .chev{color:var(--muted2); font-size:12px; flex:none; width:14px; text-align:center}
  .ideep{padding:4px 18px 18px; border-top:1px solid var(--hair)}
  .ideep .kv{margin:14px 0 6px}
  .ideep .pl{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted2); margin-bottom:6px}
  .ideep .raw{font-size:14px; color:var(--body); line-height:1.55; background:var(--soft); border:1px solid var(--hair); border-radius:var(--r-sm); padding:12px 14px; white-space:pre-wrap; word-break:break-word}
  .fitbox{background:var(--peach-bg); border:1px solid var(--peach-line); border-radius:var(--r-md); padding:12px 14px; margin:12px 0}
  .fitbox .pl{color:var(--peach)} .fitbox .pt{font-size:14px; color:var(--ink); line-height:1.5}
  .fitbox .exist{font-size:14px; color:var(--ink); line-height:1.5}
  .fitbox .exist .es{font-size:13px; color:var(--muted); margin-top:4px; line-height:1.5}
  .fitbox.fb-coral{background:var(--coral-bg); border-color:var(--coral-line)}
  .fitbox.fb-coral .pl{color:var(--coral)}
  .ideep .reason{font-size:13.5px; color:var(--muted); line-height:1.6; margin:8px 0}
  .ideep .reason b{color:var(--ink); font-weight:600}
  .ipill.tier-core{background:var(--teal-bg); color:var(--teal)}
  .ipill.tier-mid{background:var(--peach-bg); color:var(--peach)}
  .ipill.tier-leaf{background:var(--card); color:var(--muted)}
  .tiersel{width:100%; height:42px; border:1px solid var(--hair); background:var(--canvas); color:var(--ink);
    border-radius:var(--r-md); padding:0 12px; font-family:var(--sans); font-size:14px; outline:none}
  .tiersel:focus{border-color:var(--ink)}
  .ideep .extracted{font-size:15.5px; color:var(--ink); line-height:1.55; background:var(--soft);
    border:1px solid var(--hair); border-radius:var(--r-sm); padding:13px 15px; font-weight:500}
  .discs{display:flex; flex-direction:column; gap:8px; margin:14px 0 4px}
  .disc{border:1px solid var(--hair); border-radius:var(--r-sm); background:var(--canvas)}
  .disc>summary{list-style:none; cursor:pointer; padding:9px 13px; font-size:12.5px; color:var(--muted);
    font-family:var(--mono); letter-spacing:.02em; user-select:none}
  .disc>summary::-webkit-details-marker{display:none}
  .disc>summary:hover{color:var(--ink)}
  .disc>summary b{color:var(--ink); font-weight:600}
  .disc[open]>summary{border-bottom:1px solid var(--hair); color:var(--ink)}
  .disc .raw,.disc .refine{margin:12px 13px 13px}
  .disc .tiersel{margin:12px 13px 13px; width:calc(100% - 26px)}
  .disc .refine{display:flex; flex-direction:column; gap:9px}

  ::-webkit-scrollbar{width:10px} ::-webkit-scrollbar-thumb{background:var(--strong); border-radius:8px}
</style>
</head>

<div id="scrim"></div>
<div id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
// team mode: a leader token (from ?token=… or saved) unlocks validation actions.
const _token=(()=>{const t=new URL(location.href).searchParams.get("token");
  if(t){localStorage.setItem("crux_token",t);} return localStorage.getItem("crux_token")||"";})();
const api=async(u,o)=>{o=o||{}; o.headers=Object.assign({}, o.headers||{}, _token?{"x-crux-token":_token}:{}); return (await fetch(u,o)).json();};
const post=(u,b)=>api(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b||{})});
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rel=iso=>{if(!iso)return"";const d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+"m ago";
  if(d<86400)return Math.floor(d/3600)+"h ago";return Math.floor(d/86400)+"d ago";};
const CORE=["decision","constraint"], MID=["architecture","design"], LEAF=["reference","context","exploration"];

let state={view:"overview", items:[], inbox:[], working:[], conflicts:[], counts:{}, stats:{}, feed:[], expanded:{},
  kbSel:null, kbMode:"tree", kbQuery:"", kbRelated:{}, leader:true,
  lenses:[], kbLens:null, lensIds:null, workmem:[],
  threads:[], currentThread:null, openThread:null, threadView:null, unsorted:[], hotkey:"", activity:[], highlightCard:null,
  kbView:"ask", ask:{history:[],loading:false}, factPanel:null, factData:{}, kbOpen:{}};

async function load(){
  // diagnostic timing: each fetch + total, visible in the browser console (F12)
  const _t0=performance.now();
  const timed=(u)=>{const s=performance.now();return api(u).then(r=>{console.log(`[crux] ${u} ${(performance.now()-s).toFixed(0)}ms`);return r;});};
  const [it,rv,st,fd,ln,wm,th,un,ac]=await Promise.all([
    timed("/items"), timed("/review"), timed("/stats"), timed("/feed?limit=20"), timed("/lenses"),
    timed("/working"), timed("/threads"), timed("/unsorted"), timed("/activity?limit=60")]);
  console.log(`[crux] all fetches done in ${(performance.now()-_t0).toFixed(0)}ms`);
  state.items=it.items; state.inbox=rv.inbox||[]; state.conflicts=rv.conflicts||[];
  state.counts=rv.counts||{}; state.working=state.inbox;  // back-comp for overview
  state.stats=st; state.feed=fd.usages; state.lenses=(ln&&ln.lenses)||[]; state.workmem=(wm&&wm.items)||[];
  state.threads=(th&&th.threads)||[]; state.currentThread=(th&&th.current)||null;
  state.unsorted=(un&&un.steps)||[];
  state.activity=(ac&&ac.events)||[];
  if(state.openThread){ const tv=await api(`/threads/${state.openThread}`); state.threadView=tv&&tv.id?tv:null; if(!state.threadView) state.openThread=null; }
  _sig=`${st.crystals}|${st.fluid}|${st.injections}`;
  document.getElementById("t-kb").textContent=state.items.filter(i=>i.scope==="main").length;
  const need=state.inbox.length;
  const td=document.getElementById("t-dec"); td.textContent=need;
  const tw=document.getElementById("t-wm"); if(tw) tw.textContent=state.threads.filter(t=>t.status==='active').length;
  document.querySelector('[data-v="decisions"]').classList.toggle("alert", (state.counts.conflict||0)>0);
  render();
}
// Auto-refresh: poll lightweight /stats; reload only when something changed, and
// never while the user is typing/selecting (so it can't disrupt an edit).
let _sig="";
async function poll(){
  if(document.hidden) return;
  const ae=document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  try{
    const st=await api("/stats");
    const sig=`${st.crystals}|${st.fluid}|${st.injections}`;
    if(_sig && sig!==_sig) await load();
  }catch(e){}
}
setInterval(poll, 5000);

// Keep the OPEN Working thread live — new dumps get routed and the working memory
// re-refines in the background; this surfaces both automatically, no refresh/refine
// needed. Re-renders only when something actually changed, and never while you're
// typing (so it can't clobber an edit).
let _threadSig="", _threadBusy=false;
function _threadSigOf(tv){
  return [tv.context||"", tv.card_count||0, tv.wm_status||"", tv.ai_degraded?1:0,
          (tv.cards||[]).map(c=>c.id+"|"+(c.routed?1:0)+"|"+c.kind+"|"+(c.included?1:0)).join(",")
         ].join("§");
}
function setThreadView(tv){ if(tv&&tv.id){ state.threadView=tv; _threadSig=_threadSigOf(tv); } }
async function pollThread(){
  if(_threadBusy || document.hidden) return;
  if(!state.openThread || state.view!=='working') return;
  const ae=document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;  // don't disrupt an edit
  _threadBusy=true;
  try{
    const tv=await api(`/threads/${state.openThread}`);
    if(tv&&tv.id && _threadSigOf(tv)!==_threadSig){ setThreadView(tv); render(); }
  }catch(e){}finally{ _threadBusy=false; }
}
setInterval(pollThread, 2000);
function setView(v){state.view=v;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  render(); window.scrollTo(0,0);}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)setView(b.dataset.v);});

function render(){
  document.body.classList.toggle('kb-ask', state.view==='kb' && state.kbView==='ask');
  // Robustness: never let one bad field freeze the whole app. If a view throws,
  // show a recovery panel (data is safe) instead of leaving stale, unresponsive
  // DOM — that silent freeze was the "clicks do nothing / it keeps breaking".
  try{
    ({overview:vOverview,kb:vKB,working:vWorking,decisions:vDecisions,activity:vActivity}[state.view])();
  }catch(err){
    console.error('[crux] render failed for view', state.view, err);
    app(`<div class="card" style="margin-top:24px;max-width:760px"><div class="tagline coral">⚠ DISPLAY ERROR</div>
      <h3>Couldn't render this view</h3>
      <div class="desc">CRUX hit an error showing your data — nothing was lost. Switch tabs or reload.</div>
      <div class="row" style="margin-top:12px">
        <button class="btn out sm" onclick="location.reload()">Reload</button>
        <button class="btn ghost sm" onclick="setView('overview')">Overview</button>
        <button class="btn ghost sm" onclick="setView('kb')">Knowledge Base</button></div>
      <pre class="raw" style="margin-top:12px;white-space:pre-wrap;font-size:11px;max-height:200px;overflow:auto">${esc(String((err&&err.stack)||err))}</pre></div>`);
  }
}
window.addEventListener('error',e=>console.error('[crux] uncaught',e.error||e.message));

/* ---------------- WORKING MEMORY = THREADS ("what I'm doing now") ---------- */
function vWorking(){
  if(state.openThread && state.threadView){ return vThread(state.threadView); }
  const active=state.threads.filter(t=>t.status==='active');
  const done=state.threads.filter(t=>t.status!=='active');
  app(`
    <div class="crumb">WORKSPACE <b>//</b> LOCAL <b>//</b> WORKING</div>
    <h1 class="head display">Working</h1>
    <p class="sub">What you're doing right now. Start a thread with your intent — then just dump things in as you work. CRUX keeps one refined <b>context</b> of where you're headed, so any AI instantly gets it. You never organize; you only choose what stays in scope.</p>
    <div class="newthread">
      <input id="ntintent" class="ntinput" placeholder="What are you working on? e.g. “a hero image representing context fragmentation, brand warm-cream”"/>
      <button class="btn teal" onclick="startThread()">Start thread →</button>
    </div>
    ${active.length?`<div class="sectlabel">ACTIVE · ${active.length}</div>${active.map(threadCard).join("")}`:''}
    ${state.unsorted.length?`<div class="sectlabel">UNSORTED CAPTURES · ${state.unsorted.length}</div>
      <div class="muted2" style="font-size:13px;margin:-4px 0 10px">Captured with no active thread. Start a thread and new captures attach to it.</div>
      ${state.unsorted.map(unsortedRow).join("")}`:''}
    ${!active.length&&!state.unsorted.length?`<div class="empty"><div class="big">No threads yet</div>Start one above, or press your capture hotkey while working — it lands here.</div>`:''}
    ${done.length?`<div class="sectlabel" style="margin-top:26px">FINISHED · ${done.length}</div>${done.map(threadCard).join("")}`:''}`);
}
function threadCard(t){
  const cur=(state.currentThread?t.id===state.currentThread:t.is_current);
  return `<div class="tcard ${cur?'cur':''}" onclick="openThread('${t.id}')">
    <div class="tcmain">
      <div class="tctitle">${esc(t.title)} ${cur?'<span class="curpill">current</span>':''}</div>
      <div class="tcsub">${esc((t.intent||'No goal set').split('\\n')[0])}</div>
    </div>
    <div class="tcmeta"><span class="nbadge">${t.card_count||0} dump${(t.card_count||0)!==1?'s':''}</span><span class="iwhen mono">${rel(t.last_step)}</span></div>
  </div>`;
}
function unsortedRow(e){
  const open=!!state.expanded['u-'+e.id];
  const full=(e.raw_content||'');

function parseHash(){

async function askSend(q){
  const el=document.getElementById('askq');

  if(!question || state.ask.loading) return;
  if(el) el.value='';

function kbSubjectGroups(main){

/* ---- KB tree (taxonomy browsing): facts grouped by their subject_path ---- */
function kbBuildTree(items){
  const root={seg:'',path:'',children:{},items:[]}; const unfiled=[];
  items.forEach(i=>{
    const p=(i.subject_path||'').trim();
    if(!p){ unfiled.push(i); return; }
    let node=root;
    p.split('/').forEach((s,idx,arr)=>{
      node.children[s]=node.children[s]||{seg:s,path:arr.slice(0,idx+1).join('/'),children:{},items:[]};
      node=node.children[s];
    });
    node.items.push(i);
  });
  return {root,unfiled};
}
function treeTotal(node){
  return node.items.length + Object.values(node.children).reduce((a,c)=>a+treeTotal(c),0);
}
function prettySeg(s){ return (s||'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
function kbTreeNode(node,conf,depth){
  const key='tree:'+node.path;
  const open = key in state.kbOpen ? state.kbOpen[key] : depth<1;   // roots open by default
  const kids=Object.values(node.children).sort((a,b)=>treeTotal(b)-treeTotal(a));
  const childHTML=kids.map(k=>kbTreeNode(k,conf,depth+1)).join("");
  const ownItems=node.items.map(i=>navItem(i,conf)).join("");
  return `<div class="kbgroup treenode ${open?'open':''}" data-key="${esc(key)}">
    <div class="kbghead" onclick="toggleGroup(this)">
      <span class="caret">▸</span>
      <span class="kbglabel">${esc(prettySeg(node.seg))}</span>
      <span class="gcount">${treeTotal(node)}</span>
    </div>
    <div class="kbgitems">${childHTML}${ownItems}</div>
  </div>`;
}
function kbTree(items,conf){
  const {root,unfiled}=kbBuildTree(items);
  const roots=Object.values(root.children).sort((a,b)=>treeTotal(b)-treeTotal(a));
  let html=roots.map(r=>kbTreeNode(r,conf,0)).join("");
  if(unfiled.length){
    const open=!!state.kbOpen['tree:__unfiled'];
    html+=`<div class="kbgroup treenode ${open?'open':''}" data-key="tree:__unfiled">
      <div class="kbghead" onclick="toggleGroup(this)">
        <span class="caret">▸</span>
        <span class="kbglabel">Unfiled <span class="gsub">not yet placed in the tree</span></span>
        <span class="gcount">${unfiled.length}</span>
      </div>
      <div class="kbgitems">${unfiled.map(i=>navItem(i,conf)).join("")}</div></div>`;
  }
  return html || '<div class="muted2" style="font-size:13px;padding:8px">No facts yet.</div>';
}
function kbTierGroups(main){
  return TIER_ORDER.map(t=>[TIER_LABEL[t],TIER_DESC[t],main.filter(i=>(i.tier||'leaf')===t)])
    .filter(g=>g[2].length);
}
function kbTopicGroups(main){
  const byTag={};
  main.forEach(i=>{const tags=(i.tags||[]).length?i.tags:['untagged'];
    tags.forEach(t=>{(byTag[t]=byTag[t]||[]).push(i);});});
  return Object.entries(byTag).sort((a,b)=>b[1].length-a[1].length).map(([t,items])=>[t,'',items]);
}
function navItem(i,conf){
  const edges=(i.edges?i.edges.extends.length+i.edges.extended_by.length:0);
  const txt=((i.title||'')+' '+(i.summary||'')+' '+(i.tags||[]).join(' ')).toLowerCase();
  return `<div class="navitem ${i.id===state.kbSel?'sel':''}" data-text="${esc(txt)}" onclick="selectKb('${i.id}')">
    <div class="nt">${esc(i.title||'')}</div>
    <div class="ni"><span class="ipill tier-${i.tier||'leaf'}">${TIER_SHORT[i.tier||'leaf']}</span>
      ${conf.has(i.id)?'<span class="cdot c-conflict" title="has a conflict"></span>':''}
      ${edges?`<span class="nbadge">⋯${edges}</span>`:''}
      ${i.usage_count?`<span class="nbadge">⚡${i.usage_count}</span>`:''}</div>
  </div>`;
}
function kbDetail(it){
  const see=state.kbRelated[it.id];
  const edges=it.edges||{extends:[],extended_by:[]};
  const chip=x=>`<span class="ep" onclick="selectKb('${x.id}')">${esc(x.title)}</span>`;
  const conns=[];
  if(edges.extends.length) conns.push(`<div class="edge"><span class="el">extends →</span>${edges.extends.map(chip).join("")}</div>`);
  if(edges.extended_by.length) conns.push(`<div class="edge"><span class="el">extended by ←</span>${edges.extended_by.map(chip).join("")}</div>`);
  if((edges.related||[]).length) conns.push(`<div class="edge"><span class="el">related</span>${edges.related.map(chip).join("")}</div>`);
  if(see===undefined) conns.push(`<div class="edge"><span class="el">see also</span><span class="muted2" style="font-size:12px">loading…</span></div>`);

  const crumb = it.subject_path

      </div>
      <div class="fhint">🛈 <b>CRUX placed this in the tree for you.</b> Re-path it with a slash form like <span class="mono">crux/design-system/color</span> — it moves right away.</div>
    </div>`
    : `<div class="dsection"><div class="pl">Where it lives</div>
      <div class="treepath">${crumb}</div></div>`;
  return `
    <div class="dhead">
      <span class="tier teal">◆ VERIFIED · ${esc(it.type)}${it.promoted_at?` · ${it.promoted_at.slice(0,10)}`:''}</span>
    </div>
    <h2 class="dtitle">${esc(it.title||'')}</h2>

    <div class="dsection"><div class="pl">Where this came from</div>
      <div class="prov"><div class="pi">✎</div><div class="pmeta">Captured${it.source?` from <b>${esc(it.source)}</b>`:''}${it.promoted_at?`, verified <b>${it.promoted_at.slice(0,10)}</b>`:''}. The original text is below.</div></div>
      <div class="raw" style="margin-top:10px">${esc(it.raw_content||it.summary||it.title)}</div></div>
    ${filingBlock}

    <div class="dsection"><div class="pl">DETAILS</div>
      <div class="meta"><div><b>id</b> ${it.id.slice(0,8)}</div>
        <div><b>confidence</b> ${Math.round((it.confidence||0)*100)}%</div></div>
      <div class="tags">${(it.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div></div>
    ${state.leader?`
    <div class="refine" id="kbedit" style="display:none;margin:10px 0 14px">
      <input id="et" value="${esc(it.title)}" placeholder="Title…"/>
      <input id="es" value="${esc(it.summary||'')}" placeholder="Summary…"/>
      <button class="btn teal" onclick="saveEdit('${it.id}')">Save changes</button></div>
    <div class="dactions" style="margin-top:14px">
      <button class="btn sm out" onclick="document.getElementById('kbedit').style.display='flex'">✎ Edit</button>
      <button class="btn sm out" onclick="demote('${it.id}')">↩ Return to working</button>
      <button class="btn sm danger" onclick="archive('${it.id}')">Archive</button>
    </div>`:`<div class="muted2" style="font-size:12px;margin-top:14px">Read-only — the team leader maintains the knowledge base.</div>`}`;
}

function kbFilter(){

function vDecisions(){
  const inbox=state.inbox, n=inbox.length;
  const clean=state.counts.clean||0, attn=state.counts.attention||0, conf=state.counts.conflict||0;
  const inboxIds=new Set(inbox.map(i=>i.id));
  const extra=state.conflicts.filter(c=>!inboxIds.has(c.a.id)&&!inboxIds.has(c.b.id));
  app(`
    <div class="crumb">WORKSPACE <b>//</b> LOCAL <b>//</b> REVIEW</div>
    <h1 class="head display">Review inbox</h1>
    <p class="sub">Captured notes wait here. Clean ones promote in one click; anything that conflicts with or duplicates what you already know is flagged. Nothing reaches your agents until you verify it.</p>
    ${!n&&!extra.length?`<div class="empty"><div class="big">Inbox zero ✦</div>Nothing waiting. Capture as you work.</div>`:''}
    ${n?`<div class="inboxbar">
      <div class="counts">
        ${conf?`<span class="cdot c-conflict"></span><span>${conf} conflict${conf>1?'s':''}</span>`:''}
        ${attn?`<span class="cdot c-attention"></span><span>${attn} to check</span>`:''}
        ${clean?`<span class="cdot c-clean"></span><span>${clean} clean</span>`:''}
      </div>
      ${clean?`<button class="btn teal sm" onclick="promoteClean()">✓ Promote all ${clean} clean</button>`:''}
    </div>
    ${inbox.map(inboxRow).join("")}`:''}
    ${extra.length?`<div class="sectlabel">CONTRADICTIONS IN VERIFIED KNOWLEDGE · ${extra.length}</div>${extra.map(conflictCard).join("")}`:''}`);
}
function conflictCard(c){
  const reason = c.reason ? ` · ${esc(c.reason)}` : "";
  return `<div class="dcard">
    <div class="top"><span class="chip coral">⚠ POSSIBLE CONTRADICTION · ${Math.round(c.similarity*100)}% similar${reason}</span></div>
    <div class="compare">
      <div class="pane a"><div class="pl">Option A · ${esc(c.a.type)}${c.a.scope==='main'?' · verified':''}</div><div class="pt">${esc(c.a.summary||c.a.title)}</div></div>
      <div class="arrow">⇄</div>
      <div class="pane b"><div class="pl">Option B · ${esc(c.b.type)}${c.b.scope==='main'?' · verified':''}</div><div class="pt">${esc(c.b.summary||c.b.title)}</div></div>
    </div>
    <div class="dfoot"><span class="mono" style="font-size:11px;color:var(--muted2)">Keeping one supersedes the other (history is kept)</span>
      <div class="dactions">
        <button class="btn sm out" onclick="supersede('${c.b.id}','${c.a.id}')">Keep A</button>
        <button class="btn sm out" onclick="supersede('${c.a.id}','${c.b.id}')">Keep B</button>
        <button class="btn sm ghost" onclick="dismissConflict(${c.id})">Not a conflict</button>
      </div></div></div>`;
}

function inboxDeep(it){
  const r=it.fit&&it.fit.related, rel=it.fit?it.fit.relation:'new';
  const sim=r&&r.similarity?Math.round(r.similarity*100)+'%':'';
  const reason=it.fit&&it.fit.reason?esc(it.fit.reason):'';
  const where=r?(r.scope==='main'?'VERIFIED':'WORKING'):'';
  const existBox=(label,cls)=>`<div class="fitbox ${cls||''}">
      <div class="pl">${label}</div>
      <div class="exist"><b>${esc(r.title||'')}</b>${r.summary&&r.summary!==r.title?'<div class="es">'+esc(r.summary)+'</div>':''}</div></div>`;
  let fit='', acts='';
  if(rel==='update'&&r){
    fit=existBox(`UPDATES ${where} · ${sim}`,'fb-coral')
      +`<div class="reason"><b>Why —</b> ${reason||'this changes or contradicts the existing fact.'}</div>
        <div class="reason"><b>If you replace —</b> the old version is superseded (kept in history).</div>`;
    acts=`<button class="btn sm out" onclick="extendItem('${it.id}','${r.id}')">No, it extends</button>
      <button class="btn sm teal" onclick="supersede('${r.id}','${it.id}')">✓ Replace existing</button>`;
  } else if(rel==='extend'&&r){
    fit=existBox(`EXTENDS ${where} · ${sim}`)
      +`<div class="reason"><b>Why —</b> ${reason||'adds detail to the existing fact; both stay true.'}</div>
        <div class="reason"><b>If you extend —</b> the two are linked; both kept, your knowledge gets richer.</div>`;
    acts=`<button class="btn sm out" onclick="supersede('${r.id}','${it.id}')">No, it's an update</button>
      <button class="btn sm out" onclick="promoteRefined('${it.id}')">Keep separate</button>
      <button class="btn sm teal" onclick="extendItem('${it.id}','${r.id}')">✓ Extend &amp; promote</button>`;
  } else if(rel==='duplicate'&&r){
    fit=existBox(`NEAR-DUPLICATE OF ${where} · ${sim}`)
      +`<div class="reason"><b>Why —</b> ${reason||'almost identical to an existing fact — you may have it already.'}</div>`;
    acts=`<button class="btn sm out" onclick="supersede('${r.id}','${it.id}')">Replace existing</button>
      <button class="btn sm teal" onclick="promoteRefined('${it.id}')">Keep anyway</button>`;
  } else {
    fit=`<div class="reason"><b>New —</b> nothing similar yet. Promoting adds a fresh ${esc(it.type||'note')} to your Knowledge Base.</div>`;
    acts=`<button class="btn sm teal" onclick="promoteRefined('${it.id}')">✓ Verify &amp; promote</button>`;
  }
  const tier=it.tier||'leaf';
  const opt=(t)=>`<option value="${t}" ${t===tier?'selected':''}>${TIER_LABEL[t]} — ${TIER_DESC[t]}</option>`;
  const pathCrumb = it.subject_path
    ? `<div class="kv"><div class="pl">FILES INTO</div><div class="treepath">${it.subject_path.split('/').map(s=>`<span class="pcrumb">${esc(prettySeg(s))}</span>`).join('<span class="psep">›</span>')}</div></div>`
    : '';
  return `<div class="ideep">
    <div class="kv"><div class="pl">EXTRACTED KNOWLEDGE</div><div class="extracted">${esc(it.summary||it.title)}</div></div>
    ${pathCrumb}
    ${fit}
    <div class="discs">
      <details class="disc"><summary>Show original text</summary><div class="raw">${esc(it.raw_content||it.summary||it.title)}</div></details>
      <details class="disc"><summary>Change level — currently <b>${TIER_LABEL[tier]}</b></summary>
        <select id="rtier-${it.id}" class="tiersel">${opt('core')}${opt('mid')}${opt('leaf')}</select></details>
      <details class="disc"><summary>Edit title / summary</summary>
        <div class="refine">
          <input id="rt-${it.id}" value="${esc(it.title||'')}" placeholder="Title…"/>
          <input id="rs-${it.id}" value="${esc(it.summary||'')}" placeholder="Summary…"/>
        </div></details>
    </div>
    <div class="dfoot"><span class="mono" style="font-size:11px;color:var(--muted2)">${it.id.slice(0,8)}${it.source?' · '+esc(it.source):''}</span>
      <div class="dactions">
        <button class="btn sm danger" onclick="archive('${it.id}')">Discard</button>
        ${acts}
      </div></div>
  </div>`;
}

function srcStatus(msg,cls){const s=document.getElementById('srcstatus'); if(s){s.textContent=msg||''; s.className='srcstatus '+(cls||'');}}
async function _afterIngest(promise,label){
  srcStatus(`Fetching ${label}…`,'busy');
  let r; try{ r=await promise; }catch(e){ srcStatus('Network error',''); toast('Could not reach that source'); return; }
  if(r&&r.detail){ srcStatus(r.detail,'err'); toast('⚠ '+r.detail); return; }
  srcStatus(`✓ Extracting "${(r&&r.title)||label}" (${r&&r.chars||0} chars) → Review…`,'ok');
  toast('● Extracting knowledge — filing into the tree…');
  setView('decisions');
  for(let k=0;k<6;k++){await new Promise(r=>setTimeout(r,1300)); await load();}
  srcStatus('','');
}
async function ingestUrl(){
  const i=document.getElementById('srcurl'); const url=(i&&i.value.trim())||'';
  if(!url){toast('Paste a URL first');return;}
  i.value='';
  await _afterIngest(post('/ingest/url',{url}), url.replace(/^https?:\/\/(www\.)?/,'').slice(0,40));
}
async function ingestFile(input){
  const f=input&&input.files&&input.files[0]; if(!f) return;
  const fd=new FormData(); fd.append('file',f);
  const opts={method:'POST',body:fd,headers:_token?{'x-crux-token':_token}:{}};
  await _afterIngest(fetch('/ingest/file',opts).then(r=>r.json()), f.name);
  input.value='';
}

// Local state for the settings drawer (keys are write-only; we only learn
// whether each is already set, never the value itself).
let SET={data:null, sel:0, custom:null, customMode:false, presets:[], hook:true};
const _scap=m=>m==="cmd"?"Super":m==="ctrl"?"Ctrl":m[0].toUpperCase()+m.slice(1);
const _chordLabel=(mods,key)=>[...mods.map(_scap),(key==="space"?"Space":key.toUpperCase())].join(" + ");
const _RESERVED={"ctrl+shift+i":"browser DevTools","ctrl+shift+j":"browser DevTools","ctrl+shift+c":"browser DevTools",
  "ctrl+shift+k":"browser console","ctrl+w":"close tab","ctrl+t":"new tab","ctrl+n":"new window","ctrl+q":"quit app",
  "ctrl+c":"copy","ctrl+v":"paste","ctrl+x":"cut","ctrl+z":"undo","ctrl+a":"select all","ctrl+s":"save",
  "alt+tab":"switch windows","alt+f4":"close window"};
function _validateChord(mods,key){
  if(!key) return {ok:false,msg:"Press a key."};
  if(!/^([a-z0-9]|space|f([1-9]|1[0-2]))$/.test(key)) return {ok:false,msg:"Use a letter, number, Space, or F-key."};
  if(!mods.some(m=>["ctrl","alt","cmd"].includes(m))) return {ok:false,msg:"Add Ctrl, Alt, or Super — a bare key fires all the time."};
  if(SET.data&&SET.data.platform!=="darwin"&&mods.includes("cmd")) return {ok:false,msg:"Super/Win gets grabbed by the desktop — use Ctrl or Alt."};
  const id=["ctrl","alt","shift","cmd"].filter(m=>mods.includes(m)).join("+")+"+"+key;
  if(_RESERVED[id]) return {ok:false,msg:`Reserved for ${_RESERVED[id]} — pick another.`};
  return {ok:true,msg:"Looks good."};
}
function _buildPresets(plat){
  const mk=(mods,key)=>({mods,key,label:_chordLabel(mods,key)});
  if(plat==="darwin") return [mk(["cmd","shift"],"space"),mk(["cmd","ctrl"],"c"),mk(["cmd","ctrl"],"space"),mk(["cmd","shift"],"u")];
  return [mk(["ctrl","shift"],"space"),mk(["ctrl","alt"],"c"),mk(["ctrl","alt"],"k"),mk(["ctrl","alt"],"space")];
}
function _normKey(e){
  if(e.key===" "||e.code==="Space") return "space";
  if(/^[a-zA-Z]$/.test(e.key)) return e.key.toLowerCase();
  if(/^[0-9]$/.test(e.key)) return e.key;
  if(/^F([1-9]|1[0-2])$/.test(e.key)) return e.key.toLowerCase();
  return e.key.toLowerCase();
}

  document.getElementById("drawer").innerHTML='<div class="booting"><div class="spin"></div>Loading settings…</div>';
  document.getElementById("drawer").classList.add("on");
  document.getElementById("scrim").classList.add("on");
  let d; try{ d=await api("/api/setup"); }catch(e){ toast("⚠ Couldn't load settings"); return; }
  SET.data=d; SET.presets=_buildPresets(d.platform); SET.hook=!!d.hook_installed; SET.custom=null; SET.customMode=false;
  // preselect the preset matching the current hotkey (from whoami), else Custom
  SET.sel=0;
  const cur=(state.hotkey||"").trim();
  const pi=SET.presets.findIndex(p=>p.label===cur);
  if(cur){ if(pi>=0){ SET.sel=pi; } else { SET.customMode=true; } }
  renderSettings();
}

    </div>

    <div class="setsec">
      <div class="sh">Other editors · Cursor &amp; VS Code</div>
      <p class="sp">These connect through CRUX's <b>MCP server</b> — the agent gets <span class="mono">get_context</span> and <span class="mono">log_work</span> tools. We also drop a small rules file so the agent calls them on its own (closest thing to the Claude Code hook).</p>
      <label class="setfield"><span>Project folder <span class="set-off">for the rules file &amp; VS Code config</span></span>
        <input id="set-proj" class="setin" type="text" placeholder="/path/to/your/project" value="${esc(d.cwd||'')}"></label>
      <div class="chords" style="margin-bottom:4px">
        <button class="chord" onclick="connectEditor('cursor')">➜ Connect Cursor</button>
        <button class="chord" onclick="connectEditor('vscode')">➜ Connect VS Code</button>
      </div>
      <div id="set-editor-result" class="vmsg"></div>
    </div>

    <div class="acts" style="margin-top:20px">
      <button class="btn teal" id="set-save" onclick="saveSettings()">Save settings</button>
      <button class="btn out" onclick="closeDrawer()">Cancel</button>
    </div>`;
  document.getElementById("set-hooktoggle").onclick=()=>{SET.hook=!SET.hook;
    document.getElementById("set-hooktoggle").classList.toggle("on",SET.hook);};
  drawSetChords();
}
function drawSetChords(){
  const box=document.getElementById("set-chords"); if(!box) return;
  box.innerHTML=SET.presets.map((c,i)=>`<button class="chord ${(!SET.customMode&&i===SET.sel)?'on':''}" data-i="${i}">${c.label}</button>`).join("")
    +`<button class="chord ${SET.customMode?'on':''}" id="set-customchip">✎ Custom…</button>`;
  box.querySelectorAll(".chord[data-i]").forEach(b=>b.onclick=()=>{SET.customMode=false; SET.sel=+b.dataset.i; drawSetChords();});
  document.getElementById("set-customchip").onclick=()=>{SET.customMode=true; drawSetChords();
    setTimeout(()=>{const r=document.getElementById("set-recorder"); if(r) r.focus();},0);};
  updateSetHint();
}
function updateSetHint(){
  const h=document.getElementById("set-chordhint"); if(!h) return;
  if(SET.customMode){
    const v=SET.custom?_validateChord(SET.custom.mods,SET.custom.key):null;
    h.innerHTML=`<div tabindex="0" id="set-recorder" class="recorder">${SET.custom?SET.custom.label:"Click here, then press your shortcut…"}</div>`
      +`<div class="vmsg ${v?(v.ok?'ok':'bad'):''}">`+(v?(v.ok?"✓ ":"⚠ ")+v.msg:"Press a modifier + a letter/number/Space/F-key.")+`</div>`;
    const r=document.getElementById("set-recorder");
    if(r) r.onkeydown=e=>{e.preventDefault();
      if(["Control","Alt","Shift","Meta","OS"].includes(e.key)) return;
      const mods=[]; if(e.ctrlKey)mods.push("ctrl"); if(e.altKey)mods.push("alt"); if(e.shiftKey)mods.push("shift"); if(e.metaKey)mods.push("cmd");
      const key=_normKey(e); SET.custom={mods,key,label:_chordLabel(mods,key)}; updateSetHint();};
    return;
  }
  const c=SET.presets[SET.sel];
  const tips={darwin:"The tray app registers this chord (needs Accessibility permission).",
    win32:"The tray app registers this chord directly.",
    linux:"On Wayland, run `crux bind` to register it at the OS level."};
  h.className="vmsg"; h.textContent=`Chosen: ${c.label}. `+(tips[SET.data.platform]||"");
}
async function saveSettings(){
  let mods,key;
  if(SET.customMode){
    const v=SET.custom&&_validateChord(SET.custom.mods,SET.custom.key);
    if(!v||!v.ok){ updateSetHint(); toast("⚠ Pick a valid custom hotkey first"); return; }
    mods=SET.custom.mods; key=SET.custom.key;
  } else { mods=SET.presets[SET.sel].mods; key=SET.presets[SET.sel].key; }
  const val=id=>{const el=document.getElementById(id); return (el&&el.value.trim())||null;};
  const btn=document.getElementById("set-save"); if(btn){btn.disabled=true; btn.textContent="Saving…";}
  try{
    const r=await post("/api/setup",{
      nvidia_key:val("set-nv"), anthropic_key:val("set-ak"), openai_key:val("set-ok"),
      install_hook:SET.hook, chord_mods:mods, chord_key:key});
    state.hotkey=r.chord||state.hotkey;
    const bits=[`Hotkey ${r.chord}`];
    if(r.chord_rejected) bits.push(`(kept old — ${r.chord_rejected})`);
    if(r.keys_saved&&r.keys_saved.length) bits.push(`${r.keys_saved.length} key${r.keys_saved.length>1?'s':''} saved`);
    if(r.providers&&r.providers!=="offline") bits.push(`live on ${r.providers}`);
    toast("✓ "+bits.join(" · "));
    closeDrawer();
  }catch(e){ toast("⚠ Couldn't save settings ("+e+")"); }
  if(btn){btn.disabled=false; btn.textContent="Save settings";}
}
async function connectEditor(editor){
  const out=document.getElementById("set-editor-result"); if(!out) return;
  const proj=(document.getElementById("set-proj")||{}).value||"";
  out.className="vmsg"; out.textContent="Connecting "+(editor==="vscode"?"VS Code":"Cursor")+"…";
  try{
    const r=await post("/api/connect-editor",{editor, project_dir:proj.trim()||null, write_rules:true});
    if(!r.ok){ out.className="vmsg bad"; out.textContent="⚠ "+(r.error||"Couldn't connect."); return; }
    const files=(r.written||[]).map(f=>`<div class="mono" style="font-size:11.5px">wrote ${esc(f)}</div>`).join("");
    const notes=(r.notes||[]).map(n=>`<div style="margin-top:4px">• ${esc(n)}</div>`).join("");
    out.className="vmsg ok";
    out.innerHTML=`✓ Connected ${esc(r.editor)}.${files?`<div style="margin-top:6px">${files}</div>`:''}`
      +`${r.next?`<div style="margin-top:6px;color:var(--muted)">Next: ${esc(r.next)}</div>`:''}${notes?`<div style="color:var(--muted)">${notes}</div>`:''}`;
    toast("✓ Connected "+r.editor);
  }catch(e){ out.className="vmsg bad"; out.textContent="⚠ Couldn't connect ("+e+")"; }
}
// keyboard access for the avatar button
(function(){const w=document.getElementById("who");
  if(w) w.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault(); openSettings();}});})();
window.openSettings=openSettings;window.saveSettings=saveSettings;window.connectEditor=connectEditor;

window.setView=setView;window.openItem=openItem;window.doCapture=doCapture;window.promote=promote;
window.promoteRefined=promoteRefined;window.archive=archive;window.demote=demote;window.supersede=supersede;
window.closeDrawer=closeDrawer;window.toast=toast;
async function init(){
  // paint something instantly so the page is never a long blank — the content
  // area shows a light loading state while the first fetches resolve.
  const a=document.getElementById('app');
  if(a) a.innerHTML='<div class="booting"><div class="spin"></div>Loading your workspace…</div>';
  try{ const w=await api("/api/whoami"); state.leader=!!w.leader; state.hotkey=w.hotkey||""; }catch(e){ state.leader=true; }
  applyRole();
  try{ await load(); }
  catch(e){
    await new Promise(r=>setTimeout(r,700));        // server may still be warming
    try{ await load(); }
    catch(e2){ if(a) a.innerHTML='<div class="booting">Couldn\'t reach CRUX — <span class="resum" onclick="location.reload()">retry</span></div>'; }
  }
  applyRoute();   // deep link in the URL → open straight to that project/card
}
function toggleTheme(){
  const dark=document.documentElement.classList.toggle('crux-dark');
  try{ localStorage.setItem('crux-theme', dark?'dark':'light'); }catch(e){}
}
window.toggleTheme=toggleTheme;
async function addToTaskbar(){
  const btn=document.getElementById('pinbtn'); const lbl=btn&&btn.querySelector('.pinlbl');
  if(btn) btn.disabled=true;
  try{
    const r=await post('/launcher/install',{});
    toast((r&&r.ok?'✓ ':'⚠ ')+((r&&r.message)||'Could not add the icon.'));
    if(r&&r.ok&&btn){ btn.classList.add('done'); if(lbl) lbl.textContent='Added to taskbar';
      setTimeout(()=>{ btn.classList.remove('done'); if(lbl) lbl.textContent='Add to taskbar'; },4000); }
  }catch(e){ toast('⚠ Could not add the icon ('+e+')'); }
  if(btn) btn.disabled=false;
}
window.addToTaskbar=addToTaskbar;
function applyRole(){
  // members propose & use; only the leader validates. Hide the Review tab + the
  // role chip reflects it. (The server enforces this regardless of the UI.)
  const dec=document.querySelector('[data-v="decisions"]');
  if(dec) dec.style.display = state.leader ? "" : "none";
  const wmt=document.querySelector('[data-v="working"]');
  if(wmt) wmt.style.display = state.leader ? "" : "none";
  if(!state.leader && state.view==="working") state.view="overview";
  const st=document.querySelector(".status");
  if(st) st.innerHTML = state.leader ? 'Leader · <b>VALIDATES KB</b>' : 'Member · <b>PROPOSE &amp; USE</b>';
  if(!state.leader && state.view==="decisions") state.view="overview";
}
init();
</script>
