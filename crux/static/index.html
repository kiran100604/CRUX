<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CRUX</title>
<style>
  :root{
    --canvas:#fffaf0; --soft:#faf5e8; --card:#f5f0e0; --strong:#ebe6d6; --hair:#e5e5e5;
    --ink:#0a0a0a; --body:#3a3a3a; --muted:#6a6a6a; --muted2:#9a9a9a; --on:#fff;
    --teal:#1a3a3a; --teal-bg:#e8f0ee; --teal-line:#cfe0db;
    --peach:#c2682a; --peach-bg:#fff1e6; --peach-line:#f3d8c2;
    --coral:#d6402e; --coral-bg:#ffece9; --coral-line:#f6cfc8;
    --green:#1f9d57;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --pill:9999px;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--canvas); color:var(--body); font-family:var(--sans); font-size:16px;
    -webkit-font-smoothing:antialiased}
  .display{font-weight:600; letter-spacing:-.02em; color:var(--ink); line-height:1.05}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)} .muted2{color:var(--muted2)}
  button{font-family:var(--sans); cursor:pointer}
  a{color:inherit}

  /* nav */
  nav{position:sticky; top:0; z-index:30; height:64px; display:flex; align-items:center; gap:8px;
    padding:0 28px; background:var(--canvas); border-bottom:1px solid var(--hair)}
  .brand{display:flex; align-items:center; gap:10px; margin-right:22px}
  .brand .logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
    background:var(--ink)}
  .brand .logo svg{width:18px;height:18px}
  .brand .name{font-weight:700; letter-spacing:.16em; font-size:14px; color:var(--ink)}
  .brand .sub{font-size:9px; letter-spacing:.22em; color:var(--muted2); margin-top:1px}
  .tabs{display:flex; gap:4px}
  .tab{border:none; background:none; color:var(--muted); font-size:14px; font-weight:500;
    padding:8px 14px; border-radius:var(--pill); display:flex; align-items:center; gap:8px}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--ink); color:var(--on)}
  .tab .badge{font-family:var(--mono); font-size:11px; background:rgba(0,0,0,.08); color:var(--muted);
    padding:1px 7px; border-radius:var(--pill)}
  .tab.on .badge{background:rgba(255,255,255,.2); color:#fff}
  .tab.alert .badge{background:var(--coral); color:#fff}
  .navright{margin-left:auto; display:flex; align-items:center; gap:14px}
  .status{font-family:var(--mono); font-size:11px; color:var(--muted); border:1px solid var(--hair);
    border-radius:var(--pill); padding:5px 11px}
  .status b{color:var(--green)}
  .who{display:flex; align-items:center; gap:8px; border:1px solid var(--hair); border-radius:var(--pill);
    padding:4px 12px 4px 4px; font-size:13px; color:var(--ink)}
  .who .av{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;
    font-weight:600;display:grid;place-items:center}

  /* layout */
  .wrap{max-width:1180px; margin:0 auto; padding:34px 28px 80px}
  .crumb{font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--muted2);
    text-transform:uppercase; margin-bottom:22px}
  .crumb b{color:var(--muted)}

  /* hero */
  .hero{background:var(--soft); border:1px solid var(--hair); border-radius:var(--r-xl); padding:46px}
  .kicker{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted2); margin-bottom:18px}
  .hero h1{font-size:54px; margin:0 0 14px}
  .hero p{font-size:17px; color:var(--muted); max-width:620px; margin:0 0 26px; line-height:1.5}
  .row{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
  .btn{border:none; border-radius:var(--r-md); font-size:14px; font-weight:600; padding:0 20px; height:46px;
    display:inline-flex; align-items:center; gap:9px}
  .btn.primary{background:var(--ink); color:var(--on)}
  .btn.primary:hover{filter:brightness(1.15)}
  .btn.ghost{background:transparent; color:var(--ink); text-decoration:underline; text-underline-offset:3px;
    padding:0 4px; font-weight:500}
  .btn.teal{background:var(--teal); color:#fff}
  .btn.sm{height:38px; font-size:13px; padding:0 15px}
  .btn.out{background:var(--canvas); border:1px solid var(--hair); color:var(--ink)}
  .btn.danger{background:transparent; color:var(--coral); border:1px solid var(--coral-line)}

  /* capture */
  .capture{display:flex; gap:10px; margin-top:24px}
  .capture input{flex:1; height:50px; border:1px solid var(--hair); background:var(--canvas);
    border-radius:var(--r-md); padding:0 18px; font-size:15px; color:var(--ink); outline:none}
  .capture input:focus{border-color:var(--ink)}

  /* grid + cards */
  .cols{display:grid; grid-template-columns:1fr 1fr 360px; gap:18px; margin-top:18px}
  @media(max-width:980px){.cols{grid-template-columns:1fr}}
  .card{background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-lg); padding:24px}
  .card.accent-peach{background:var(--peach-bg); border-color:var(--peach-line)}
  .card.accent-coral{background:var(--coral-bg); border-color:var(--coral-line)}
  .card.accent-teal{background:var(--teal-bg); border-color:var(--teal-line)}
  .tagline{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:14px}
  .tagline.coral{color:var(--coral)} .tagline.peach{color:var(--peach)} .tagline.teal{color:var(--teal)}
  .card h3{font-size:19px; color:var(--ink); margin:0 0 10px; line-height:1.3; font-weight:600; letter-spacing:-.01em}
  .card .desc{font-size:14px; color:var(--muted); line-height:1.55; margin-bottom:18px}
  .card .foot{display:flex; gap:10px; align-items:center}

  /* activity */
  .act h4{font-family:var(--sans); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin:0 0 16px; display:flex; justify-content:space-between; align-items:center}
  .live{font-family:var(--mono); font-size:10px; color:var(--green); display:flex; gap:6px; align-items:center}
  .live::before{content:""; width:7px;height:7px;border-radius:50%;background:var(--green)}
  .ev{padding:13px 0; border-top:1px solid var(--hair)}
  .ev:first-of-type{border-top:none; padding-top:0}
  .ev .tag{font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:6px; margin-right:8px}
  .ev .when{font-family:var(--mono); font-size:11px; color:var(--muted2)}
  .ev .txt{font-size:13.5px; color:var(--body); margin-top:7px; line-height:1.5}
  .ev .txt b{color:var(--ink); font-weight:600}

  /* stat strip */
  .strip{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--hair);
    border:1px solid var(--hair); border-radius:var(--r-lg); overflow:hidden; margin-top:18px}
  .stat{background:var(--canvas); padding:18px 22px}
  .stat .l{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted2)}
  .stat .v{font-size:22px; color:var(--ink); margin-top:6px; font-weight:600; letter-spacing:-.01em}
  .stat .v small{font-size:13px; color:var(--green); font-weight:500; margin-left:6px}

  /* lists (KB / decisions) */
  .sectlabel{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted2); margin:30px 0 12px}
  .item{display:flex; gap:14px; padding:16px 18px; background:var(--canvas); border:1px solid var(--hair);
    border-radius:var(--r-lg); margin-bottom:10px; align-items:flex-start; cursor:pointer}
  .item:hover{border-color:var(--muted2)}
  .item .bar{width:4px; align-self:stretch; border-radius:3px; flex:none}
  .bar.teal{background:var(--teal)} .bar.peach{background:var(--peach)}
  .item .main{flex:1; min-width:0}
  .item .ti{font-size:15.5px; color:var(--ink); font-weight:600; letter-spacing:-.01em}
  .item .su{font-size:13.5px; color:var(--muted); margin-top:4px; line-height:1.5}
  .item .met{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap}
  .pill{font-family:var(--mono); font-size:10.5px; padding:3px 9px; border-radius:var(--pill);
    background:var(--card); color:var(--muted)}
  .pill.type{background:var(--teal-bg); color:var(--teal)}
  .pill.use{background:var(--peach-bg); color:var(--peach)}
  .pill.src{background:none; color:var(--muted2)}

  .seg{display:inline-flex; gap:2px; background:var(--card); border-radius:var(--pill); padding:4px; margin-bottom:6px}
  .seg button{border:none; background:none; color:var(--muted); font-family:var(--mono); font-size:12px;
    padding:6px 13px; border-radius:var(--pill)}
  .seg button.on{background:var(--canvas); color:var(--ink)}
  .seg button .d{display:inline-block; width:7px;height:7px;border-radius:50%; margin-right:6px; vertical-align:middle}

  .head{font-size:30px; margin:0 0 6px}
  .sub{font-size:15px; color:var(--muted); margin:0 0 26px; max-width:680px; line-height:1.5}

  /* conflict / decision card */
  .dcard{background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-xl); padding:30px; margin-bottom:18px}
  .dcard .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:12px}
  .chip{font-family:var(--mono); font-size:11px; padding:5px 11px; border-radius:var(--r-sm)}
  .chip.coral{background:var(--coral-bg); color:var(--coral)} .chip.peach{background:var(--peach-bg); color:var(--peach)}
  .dcard h3{font-size:22px; color:var(--ink); margin:0 0 18px; letter-spacing:-.01em}
  .compare{display:grid; grid-template-columns:1fr 40px 1fr; align-items:center; gap:0}
  @media(max-width:760px){.compare{grid-template-columns:1fr; gap:10px}}
  .pane{border-radius:var(--r-md); padding:18px}
  .pane.a{background:var(--coral-bg)} .pane.b{background:var(--teal-bg)}
  .pane .pl{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px}
  .pane.a .pl{color:var(--coral)} .pane.b .pl{color:var(--teal)}
  .pane .pt{font-size:14px; color:var(--ink); line-height:1.5}
  .arrow{text-align:center; color:var(--muted2)}
  .dfoot{display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px; flex-wrap:wrap}
  .dactions{display:flex; gap:9px}
  .refine{display:flex; flex-direction:column; gap:9px; margin-top:14px}
  .refine input{height:42px; border:1px solid var(--hair); background:var(--soft); border-radius:var(--r-md);
    padding:0 14px; font-size:14px; color:var(--ink); outline:none}
  .refine input:focus{border-color:var(--ink)}

  /* drawer */
  #scrim{position:fixed; inset:0; background:rgba(20,15,5,.28); z-index:40; opacity:0; pointer-events:none; transition:.25s}
  #scrim.on{opacity:1; pointer-events:auto}
  #drawer{position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; z-index:41; background:var(--canvas);
    border-left:1px solid var(--hair); transform:translateX(100%); transition:transform .3s cubic-bezier(.4,.2,.2,1);
    overflow:auto; padding:30px}
  #drawer.on{transform:none}
  #drawer .tier{display:inline-block; font-family:var(--mono); font-size:11px; padding:5px 11px; border-radius:var(--pill); margin-bottom:16px}
  .tier.teal{background:var(--teal-bg); color:var(--teal)} .tier.peach{background:var(--peach-bg); color:var(--peach)}
  #drawer h2{font-size:24px; color:var(--ink); margin:0 0 10px; letter-spacing:-.02em; line-height:1.2}
  #drawer .ds{font-size:15px; color:var(--muted); line-height:1.6; margin-bottom:18px}
  .usedb{display:inline-flex; gap:7px; align-items:center; font-family:var(--mono); font-size:12px; color:var(--green);
    background:rgba(31,157,87,.08); border:1px solid rgba(31,157,87,.2); padding:7px 12px; border-radius:var(--r-sm); margin-bottom:18px}
  .meta{font-family:var(--mono); font-size:12px; color:var(--muted); line-height:2; margin-bottom:18px}
  .meta b{color:var(--muted2); font-weight:400}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
  .acts{display:flex; flex-direction:column; gap:9px}
  .acts .btn{justify-content:center; width:100%}

  /* search results */
  #res{position:absolute; z-index:35; background:var(--canvas); border:1px solid var(--hair); border-radius:var(--r-md);
    box-shadow:0 20px 50px rgba(40,30,10,.14); margin-top:6px; width:100%; display:none; overflow:hidden}
  #res.on{display:block}
  .rrow{display:flex; gap:10px; align-items:baseline; padding:11px 16px; cursor:pointer}
  .rrow:hover{background:var(--soft)}
  .rrow .dot{width:8px;height:8px;border-radius:50%; flex:none; transform:translateY(2px)}
  .rrow b{font-size:14px; color:var(--ink); font-weight:600} .rrow span{display:block; font-size:12px; color:var(--muted); margin-top:2px}
  .rrow .sc{font-family:var(--mono); font-size:11px; color:var(--muted2)}

  .empty{text-align:center; color:var(--muted2); padding:70px 0}
  .empty .big{font-size:20px; color:var(--muted); margin-bottom:8px; font-weight:500}

  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(16px); z-index:60;
    background:var(--ink); color:#fff; border-radius:var(--r-md); padding:12px 20px; font-size:14px; opacity:0;
    transition:.3s; pointer-events:none}
  .toast.on{opacity:1; transform:translateX(-50%)}
  footer{background:var(--soft); border-top:1px solid var(--hair); padding:34px 28px; text-align:center;
    font-family:var(--mono); font-size:11px; color:var(--muted2); letter-spacing:.08em}
  ::-webkit-scrollbar{width:10px} ::-webkit-scrollbar-thumb{background:var(--strong); border-radius:8px}
</style>
</head>
<body>
<nav>
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L20 7 L20 17 L12 22 L4 17 L4 7 Z" stroke="#fffaf0" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="#fffaf0"/></svg></span>
    <div><div class="name">CRUX</div><div class="sub">CONTEXT BRAIN</div></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-v="overview">◵ Overview</button>
    <button class="tab" data-v="kb">▢ Knowledge Base <span class="badge" id="t-kb">0</span></button>
    <button class="tab" data-v="decisions">☑ Review <span class="badge" id="t-dec">0</span></button>
    <button class="tab" data-v="activity">⚡ Activity</button>
  </div>
  <div class="navright">
    <span class="status">Local · <b>READY</b></span>
    <span class="who"><span class="av" id="av">U</span><span id="whoname">You</span></span>
  </div>
</nav>

<div id="app" class="wrap"></div>
<footer>CRUX · LOCAL-FIRST CONTEXT LAYER · YOUR DATA NEVER LEAVES THIS MACHINE</footer>

<div id="scrim"></div>
<div id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
const api=async(u,o)=>(await fetch(u,o)).json();
const post=(u,b)=>api(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b||{})});
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rel=iso=>{if(!iso)return"";const d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+"m ago";
  if(d<86400)return Math.floor(d/3600)+"h ago";return Math.floor(d/86400)+"d ago";};
const CORE=["decision","constraint"], MID=["architecture","design"], LEAF=["reference","context","exploration"];

let state={view:"overview", items:[], working:[], conflicts:[], stats:{}, feed:[]};

async function load(){
  const [it,rv,st,fd]=await Promise.all([
    api("/items"), api("/review"), api("/stats"), api("/feed?limit=20")]);
  state.items=it.items; state.working=rv.working; state.conflicts=rv.conflicts;
  state.stats=st; state.feed=fd.usages;
  document.getElementById("t-kb").textContent=state.items.filter(i=>i.scope==="main").length;
  const need=state.working.length+state.conflicts.length;
  const td=document.getElementById("t-dec"); td.textContent=need;
  document.querySelector('[data-v="decisions"]').classList.toggle("alert", state.conflicts.length>0);
  render();
}
function setView(v){state.view=v;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  render(); window.scrollTo(0,0);}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)setView(b.dataset.v);});

function render(){({overview:vOverview,kb:vKB,decisions:vDecisions,activity:vActivity}[state.view])();}

/* ---------------- OVERVIEW ---------------- */
function vOverview(){
  const need=state.working.length+state.conflicts.length;
  const date=new Date().toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"}).toUpperCase();
  const attn=[
    ...state.conflicts.map(c=>({kind:"conflict",c})),
    ...state.working.map(w=>({kind:"working",w}))
  ].slice(0,2);
  const hero = need
    ? `<h1 class="display">${need} thing${need>1?'s':''} need your attention.</h1>
       <p>You have ${state.working.length} working note${state.working.length!==1?'s':''} to verify${state.conflicts.length?` and ${state.conflicts.length} possible contradiction${state.conflicts.length>1?'s':''} to resolve`:''}. A quick review keeps your agents pulling only what's true.</p>
       <div class="row"><button class="btn primary" onclick="setView('decisions')">Review now →</button>
       <button class="btn ghost" onclick="setView('kb')">or browse everything</button></div>`
    : `<h1 class="display">You're all clear.</h1>
       <p>Nothing to review. Everything captured is either verified or settling in your working layer. Capture something below whenever a decision or constraint comes up.</p>`;
  app(`
    <div class="crumb">WORKSPACE <b>//</b> LOCAL <b>//</b> OVERVIEW</div>
    <div class="hero">
      <div class="kicker">${date} · LOCAL-FIRST</div>
      ${hero}
      <div class="capture" style="position:relative">
        <input id="cap" placeholder="Capture a decision, constraint, or note…" autocomplete="off"/>
        <button class="btn primary" onclick="doCapture()">Capture</button>
        <div id="res"></div>
      </div>
    </div>
    <div class="cols">
      ${attn.length?attn.map(renderAttn).join(""):`<div class="card" style="grid-column:span 2"><div class="tagline teal">ALL CLEAR</div><h3>No pending items</h3><div class="desc">Captured notes you promote will become verified knowledge your agents prioritize.</div></div>`}
      <div class="card act">
        <h4>Recent activity <span class="live">LIVE</span></h4>
        ${feedHTML(state.feed.slice(0,5)) || '<div class="muted2" style="font-size:13px">No injections yet. When an agent pulls your context, it shows here.</div>'}
      </div>
    </div>
    <div class="strip">
      <div class="stat"><div class="l">Knowledge base</div><div class="v">${state.stats.crystals||0} verified</div></div>
      <div class="stat"><div class="l">Working layer</div><div class="v">${state.stats.fluid||0} notes</div></div>
      <div class="stat"><div class="l">Agent injections</div><div class="v">${state.stats.injections||0}<small>payoff</small></div></div>
    </div>`);
  wireCapture();
}
function renderAttn(a){
  if(a.kind==="conflict"){const c=a.c;
    return `<div class="card accent-coral"><div class="tagline coral">⚠ POSSIBLE CONTRADICTION</div>
      <h3>${esc(c.a.title)}</h3>
      <div class="desc">This looks like it may conflict with “${esc(c.b.title)}”. Pick which one is true.</div>
      <div class="foot"><button class="btn sm primary" onclick="setView('decisions')">Resolve →</button></div></div>`;}
  const w=a.w;
  return `<div class="card accent-peach"><div class="tagline peach">● WORKING · ${esc(w.type)}</div>
    <h3>${esc(w.title)}</h3><div class="desc">${esc(w.summary||'')}</div>
    <div class="foot"><button class="btn sm teal" onclick="promote('${w.id}')">Verify →</button>
    <button class="btn sm ghost" onclick="openItem('${w.id}')">Open</button></div></div>`;
}

/* ---------------- KNOWLEDGE BASE ---------------- */
function vKB(){
  const main=state.items.filter(i=>i.scope==="main");
  const group=(label,types)=>{const g=main.filter(i=>types.includes(i.type));
    return g.length?`<div class="sectlabel">${label} · ${g.length}</div>${g.map(itemRow).join("")}`:"";};
  app(`
    <div class="crumb">WORKSPACE <b>//</b> LOCAL <b>//</b> KNOWLEDGE BASE</div>
    <h1 class="head display">Verified knowledge</h1>
    <p class="sub">Everything you've promoted to the main graph — the only things your agents treat as locked truth, ranked by tier.</p>
    <div class="capture" style="max-width:520px; position:relative; margin-bottom:8px">
      <input id="cap" placeholder="Search your knowledge…" autocomplete="off"/>
      <div id="res"></div>
    </div>
    ${main.length? group("TIER 1 · CORE — decisions & constraints",CORE)
      + group("TIER 2 · STRUCTURE — architecture & design",MID)
      + group("TIER 3 · SUPPORTING — references & context",LEAF)
      : `<div class="empty"><div class="big">Nothing verified yet</div>Promote working notes in Review to build your knowledge base.</div>`}`);
  wireSearch();
}
function itemRow(i){
  return `<div class="item" onclick="openItem('${i.id}')"><div class="bar teal"></div><div class="main">
    <div class="ti">${esc(i.title)}</div><div class="su">${esc(i.summary||'')}</div>
    <div class="met"><span class="pill type">${esc(i.type)}</span>
      ${i.usage_count?`<span class="pill use">⚡ used ${i.usage_count}×</span>`:''}
      ${(i.tags||[]).slice(0,3).map(t=>`<span class="pill">${esc(t)}</span>`).join("")}
      ${i.source?`<span class="pill src">${esc(i.source)}</span>`:''}</div></div></div>`;
}

/* ---------------- REVIEW / DECISIONS ---------------- */
function vDecisions(){
  const total=state.conflicts.length+state.working.length;
  app(`
    <div class="crumb">WORKSPACE <b>//</b> LOCAL <b>//</b> REVIEW</div>
    <h1 class="head display">Alignment center</h1>
    <p class="sub">Promote working notes into verified knowledge, and resolve anything that looks contradictory. This gate is how only-true things reach your agents.</p>
    ${!total?`<div class="empty"><div class="big">Inbox zero ✦</div>Nothing waiting. Capture more as you work.</div>`:''}
    ${state.conflicts.map(conflictCard).join("")}
    ${state.working.length?`<div class="sectlabel">PENDING VERIFICATION · ${state.working.length}</div>`:''}
    ${state.working.map(workingCard).join("")}`);
}
function conflictCard(c){
  const reason = c.reason ? ` · ${esc(c.reason)}` : "";
  return `<div class="dcard">
    <div class="top"><span class="chip coral">⚠ POSSIBLE CONTRADICTION · ${Math.round(c.similarity*100)}% similar${reason}</span></div>
    <div class="compare">
      <div class="pane a"><div class="pl">Option A · ${esc(c.a.type)}${c.a.scope==='main'?' · verified':''}</div><div class="pt">${esc(c.a.summary||c.a.title)}</div></div>
      <div class="arrow">⇄</div>
      <div class="pane b"><div class="pl">Option B · ${esc(c.b.type)}${c.b.scope==='main'?' · verified':''}</div><div class="pt">${esc(c.b.summary||c.b.title)}</div></div>
    </div>
    <div class="dfoot"><span class="mono" style="font-size:11px;color:var(--muted2)">Keeping one supersedes the other (history is kept)</span>
      <div class="dactions">
        <button class="btn sm out" onclick="supersede('${c.b.id}','${c.a.id}')">Keep A</button>
        <button class="btn sm out" onclick="supersede('${c.a.id}','${c.b.id}')">Keep B</button>
        <button class="btn sm ghost" onclick="dismissConflict(${c.id})">Not a conflict</button>
      </div></div></div>`;
}
async function dismissConflict(id){await post(`/conflicts/${id}/dismiss`,{}); toast("Dismissed — won't resurface"); await load();}
async function saveEdit(id){
  const t=document.getElementById('et').value.trim(), s=document.getElementById('es').value.trim();
  await post(`/items/${id}/edit`,{title:t||null,summary:s||null});
  toast("✓ Edited & re-embedded"); closeDrawer(); await load();}
window.dismissConflict=dismissConflict; window.saveEdit=saveEdit;
function workingCard(w){
  return `<div class="dcard">
    <div class="top"><span class="chip peach">● WORKING · ${esc(w.type)}</span>
      <span class="mono" style="font-size:11px;color:var(--muted2)">captured ${rel(w.captured_at)}</span></div>
    <h3>${esc(w.title)}</h3>
    <div class="refine">
      <input id="rt-${w.id}" value="${esc(w.title)}" placeholder="Refine title…"/>
      <input id="rs-${w.id}" value="${esc(w.summary||'')}" placeholder="Refine summary…"/>
    </div>
    <div class="dfoot"><span class="mono" style="font-size:11px;color:var(--muted2)">${w.id.slice(0,8)}${w.source?' · '+esc(w.source):''}</span>
      <div class="dactions">
        <button class="btn sm danger" onclick="archive('${w.id}')">Discard</button>
        <button class="btn sm ghost" onclick="openItem('${w.id}')">Details</button>
        <button class="btn sm teal" onclick="promoteRefined('${w.id}')">✓ Verify &amp; promote</button>
      </div></div></div>`;
}

/* ---------------- ACTIVITY ---------------- */
function vActivity(){
  app(`
    <div class="crumb">WORKSPACE <b>//</b> LOCAL <b>//</b> ACTIVITY</div>
    <h1 class="head display">Your past self, helping you now</h1>
    <p class="sub">Every time an agent pulls your context through the CRUX hook, it lands here. This is the value you can usually never see.</p>
    <div class="card" style="max-width:760px">
      <h4 style="font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 18px">Injection feed</h4>
      ${feedHTML(state.feed) || '<div class="muted2" style="font-size:14px">No injections yet. Run <span class="mono">crux install-hook</span>, then start a task in Claude Code.</div>'}
    </div>`);
}
function feedHTML(feed){
  if(!feed||!feed.length) return "";
  return feed.map(u=>`<div class="ev">
    <span class="tag" style="background:${u.scope==='main'?'var(--teal-bg)':'var(--peach-bg)'};color:${u.scope==='main'?'var(--teal)':'var(--peach)'}">${u.scope==='main'?'VERIFIED':'working'}</span>
    <span class="when">${rel(u.used_at)}</span>
    <div class="txt"><b>${esc(u.title)}</b> was injected for “${esc((u.query||'').slice(0,70))}”</div></div>`).join("");
}

/* ---------------- actions ---------------- */
function app(html){document.getElementById("app").innerHTML=html;}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("on"),2200);}

async function doCapture(){const i=document.getElementById("cap");const v=i.value.trim();if(!v)return;
  i.value=""; document.getElementById("res").classList.remove("on");
  if(v.length>400||v.includes("\n")){ // long paste / document → async multi-fact ingest
    await post("/ingest",{content:v,source_type:"paste"});
    toast("● Ingesting document in the background…"); setView("decisions");
    for(let i=0;i<6;i++){await new Promise(r=>setTimeout(r,1200)); await load();}  // poll as facts appear
    return;}
  const it=await post("/capture",{content:v}); toast("● Captured to working layer");
  await load(); setTimeout(()=>openItem(it.id),200);}
function wireCapture(){const i=document.getElementById("cap"); if(!i)return;
  i.addEventListener("keydown",e=>{if(e.key==="Enter")doCapture();});
  wireSearch();}
let stmr; function wireSearch(){const i=document.getElementById("cap"); if(!i)return;
  i.addEventListener("input",e=>{clearTimeout(stmr);const q=e.target.value.trim();const box=document.getElementById("res");
    if(q.length<3){box.classList.remove("on");return;}
    stmr=setTimeout(async()=>{const {items}=await api("/search?limit=6&q="+encodeURIComponent(q));
      if(!items.length){box.classList.remove("on");return;}
      box.innerHTML=items.map(r=>`<div class="rrow" onclick="openItem('${r.id}')">
        <span class="dot" style="background:${r.scope==='main'?'var(--teal)':'var(--peach)'}"></span>
        <span style="flex:1"><b>${esc(r.title)}</b><span>${esc(r.summary||'')}</span></span>
        <span class="sc">${r.score.toFixed(3)}</span></div>`).join("");
      box.classList.add("on");},180);});}

async function promote(id){await post(`/items/${id}/promote`,{}); toast("✓ Verified — agents will prioritize it"); await load();}
async function promoteRefined(id){
  const t=document.getElementById("rt-"+id), s=document.getElementById("rs-"+id);
  await post(`/items/${id}/promote`,{title:(t&&t.value.trim())||null, summary:(s&&s.value.trim())||null});
  toast("✓ Verified & promoted"); await load();}
async function archive(id){await post(`/items/${id}/archive`,{}); toast("Discarded"); closeDrawer(); await load();}
async function demote(id){await post(`/items/${id}/demote`,{}); toast("Returned to working layer"); closeDrawer(); await load();}
async function supersede(oldId,newId){await fetch(`/items/${oldId}/supersede?new_id=${newId}`,{method:"POST"});
  toast("Resolved — older version kept in history"); await load();}

/* ---------------- drawer ---------------- */
function openItem(id){const it=state.items.find(x=>x.id===id)||state.working.find(x=>x.id===id);if(!it)return;
  const isM=it.scope==="main";
  document.getElementById("drawer").innerHTML=`
    <span class="tier ${isM?'teal':'peach'}">${isM?'◆ VERIFIED · main graph':'● WORKING · provisional'} · ${esc(it.type)}</span>
    <h2>${esc(it.title)}</h2><div class="ds">${esc(it.summary||'')}</div>
    ${it.usage_count?`<div class="usedb">⚡ used ${it.usage_count}× by agents${it.last_used?` · last ${rel(it.last_used)}`:''}</div>`:''}
    <div class="meta">
      <div><b>id</b> ${it.id.slice(0,8)}</div>
      <div><b>captured</b> ${(it.captured_at||'').slice(0,10)}</div>
      ${it.promoted_at?`<div><b>verified</b> ${it.promoted_at.slice(0,10)}</div>`:''}
      ${it.source?`<div><b>source</b> ${esc(it.source)}</div>`:''}
      <div><b>confidence</b> ${Math.round((it.confidence||0)*100)}%</div></div>
    <div class="tags">${(it.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div>
    <div class="refine" id="edit-${it.id}" style="display:none;margin-bottom:14px">
      <input id="et" value="${esc(it.title)}" placeholder="Title…"/>
      <input id="es" value="${esc(it.summary||'')}" placeholder="Summary…"/>
      <button class="btn teal" onclick="saveEdit('${it.id}')">Save changes</button>
    </div>
    <div class="acts">
      ${isM?`<button class="btn out" onclick="demote('${it.id}')">↩ Return to working</button>`
            :`<button class="btn teal" onclick="promote('${it.id}');closeDrawer()">✓ Verify &amp; promote</button>`}
      <button class="btn out" onclick="document.getElementById('edit-${it.id}').style.display='flex'">✎ Edit text</button>
      <button class="btn danger" onclick="archive('${it.id}')">Archive</button>
    </div>`;
  document.getElementById("drawer").classList.add("on");
  document.getElementById("scrim").classList.add("on");}
function closeDrawer(){document.getElementById("drawer").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");}
document.getElementById("scrim").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
document.addEventListener("click",e=>{const box=document.getElementById("res");
  if(box&&!e.target.closest(".capture"))box.classList.remove("on");});

window.setView=setView;window.openItem=openItem;window.doCapture=doCapture;window.promote=promote;
window.promoteRefined=promoteRefined;window.archive=archive;window.demote=demote;window.supersede=supersede;
window.closeDrawer=closeDrawer;window.toast=toast;
load();
</script>
</body>
</html>
