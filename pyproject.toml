[project]
name = "cortex"
version = "0.2.0"
description = "Local-first context layer that auto-injects relevant project knowledge into AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Real providers / surfaces are optional so the core loop runs fully offline.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
cortex = "cortex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cortex"]
