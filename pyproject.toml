[project]
name = "crux"
version = "0.2.0"
description = "Local-first context layer that auto-injects relevant project knowledge into AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Real providers / surfaces are optional so the core loop runs fully offline.
anthropic = ["anthropic>=0.40"]
# openai>=1.57 avoids the httpx>=0.28 'proxies' TypeError on client init.
openai = ["openai>=1.57"]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
mcp = ["mcp>=1.0"]
app = ["pystray>=0.19", "pynput>=1.7", "pillow>=10.0", "fastapi>=0.110", "uvicorn>=0.27"]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
crux = "crux.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crux"]
